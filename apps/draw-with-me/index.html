<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw With Me</title>
<style>
  :root { --ink: #2B2140; --bg: #FFF8EC; --pink: #FF4F8B; --green: #3BB273; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  section { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 18px max(14px, env(safe-area-inset-bottom)); }
  section[hidden] { display: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .round { width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--ink); background: #FFFFFF; font-size: 34px; display: grid; place-items: center; flex: none; padding: 0; }
  .round:active, .pick:active, .filt:active, .sw:active { transform: scale(0.94); }
  .bar { display: flex; align-items: center; gap: 14px; }
  .bar h1, .bar h2 { flex: 1; margin: 0; text-align: center; font-weight: 900; }
  h1 { font-size: 44px; } h2 { font-size: 32px; }
  /* home */
  #home .bar h1 span { color: var(--pink); }
  #ask { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 4px; }
  #mic { width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--ink); background: var(--pink); font-size: 70px; display: grid; place-items: center; box-shadow: 0 8px 0 rgba(43,33,64,0.18); }
  #mic[data-state="listening"] { animation: pulse 1s infinite; background: #FF7FA8; }
  #mic[data-state="off"] { display: none; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(255,79,139,0.2); } }
  #asklabel { font-size: 26px; font-weight: 800; }
  #heard { min-height: 32px; font-size: 24px; font-weight: 700; color: #6A5A86; text-align: center; }
  #picks { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; padding: 6px 4px 12px; align-content: start; touch-action: pan-y; }
  .pick { border: 4px solid var(--ink); border-radius: 22px; background: #FFFFFF; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px; font-weight: 800; font-size: 17px; }
  #galbar { flex: none; display: flex; align-items: center; gap: 10px; margin: 6px 4px 0; padding: 6px 14px; border: 3px solid var(--ink); border-radius: 999px; background: #FFFFFF; font: 800 18px system-ui, sans-serif; color: var(--ink); cursor: pointer; }
  #galbar:active { transform: scale(0.98); }
  #galpeek { display: flex; gap: 6px; margin-left: auto; }
  #galpeek canvas { width: 36px; height: 36px; border: 2px solid var(--ink); border-radius: 8px; background: #FFFFFF; }
  #galsheet { position: fixed; inset: 0; background: rgba(43,33,64,.85); z-index: 30; overflow: auto; padding: 18px; }
  #galsheet .sheet { background: var(--paper, #FFF9F0); border-radius: 28px; padding: 14px 18px 22px; max-width: 1100px; margin: 0 auto; }
  #galsheet .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  #galleryhead { font-size: 26px; font-weight: 900; margin: 0; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 14px; justify-content: center; }
  .gal { width: 150px; height: 150px; border: 4px solid var(--ink); border-radius: 18px; padding: 0; overflow: hidden; background: #FFFFFF; }
  .gal canvas { width: 100%; height: 100%; display: block; }
  /* drawing */
  #steptext { font-size: 34px; font-weight: 900; text-align: center; min-height: 46px; margin: 6px 0 2px; }
  #stepdots { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
  #stepdots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: #FFFFFF; }
  #stepdots i.done { background: var(--green); } #stepdots i.now { background: var(--pink); transform: scale(1.25); }
  .work { flex: 1; display: flex; gap: 14px; min-height: 0; align-items: stretch; }
  .rail { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .rail .round { width: 80px; height: 80px; }
  .rail small { display: block; font-size: 13px; font-weight: 800; text-align: center; margin-top: -8px; }
  .stagebox { flex: 1; display: grid; place-items: center; min-width: 0; min-height: 0; }
  #stage { position: relative; background: #FFFFFF; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 6px 0 rgba(43,33,64,0.12); }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage canvas { pointer-events: none; } #touch { touch-action: none; pointer-events: auto !important; }
  #shade { mix-blend-mode: multiply; }
  #next { width: 120px; height: 120px; font-size: 60px; background: var(--green); color: #FFFFFF; }
  /* coloring */
  #tools { display: grid; grid-template-columns: 1fr; gap: 10px; align-content: center; }
  #tools button.on, #sizes button.on { background: #FFC93C; }
  #sizes { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #sizes button { width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--ink); background: #FFFFFF; display: grid; place-items: center; padding: 0; }
  #sizes i { display: block; border-radius: 50%; background: var(--ink); }
  #palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-top: 10px; }
  .sw { width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--ink); padding: 0; }
  .sw.on { box-shadow: 0 0 0 5px #FFC93C; transform: scale(1.1); }
  #done { width: auto; padding: 0 22px; border-radius: 40px; font-size: 28px; font-weight: 900; background: var(--green); color: #FFFFFF; }
  /* finish */
  #finish .work { align-items: center; }
  #result { border: 4px solid var(--ink); border-radius: 18px; background: #FFFFFF; height: 100%; max-height: calc(100vh - 140px); aspect-ratio: 1; }
  #filters { display: grid; grid-template-columns: repeat(2, 140px); gap: 12px; align-content: center; }
  .filt { border: 4px solid var(--ink); border-radius: 18px; background: #FFFFFF; padding: 6px; display: grid; justify-items: center; gap: 4px; font-weight: 800; font-size: 16px; }
  .filt.on { background: #FFC93C; }
  .fprev { width: 112px; height: 112px; border-radius: 10px; }
  #save { width: auto; padding: 0 26px; border-radius: 40px; font-size: 30px; font-weight: 900; background: #FFC93C; }
  /* view */
  #viewcanvas { max-width: 100%; max-height: calc(100vh - 130px); border: 4px solid var(--ink); border-radius: 18px; background: #FFFFFF; margin: auto; }
  #thinking { position: fixed; inset: 0; z-index: 9; background: rgba(255,248,236,0.92); display: grid; place-items: center; align-content: center; gap: 18px; }
  #thinking[hidden] { display: none; }
  #thinking .pencil { font-size: 110px; animation: doodle 1.2s ease-in-out infinite; }
  @keyframes doodle { 0%, 100% { transform: rotate(-12deg) translate(-20px, 0); } 50% { transform: rotate(12deg) translate(20px, -10px); } }
  #thinkingtext { font-size: 34px; font-weight: 900; text-align: center; padding: 0 30px; }
  #pen { display: flex; justify-content: center; align-items: center; gap: 10px; padding-top: 10px; flex-wrap: wrap; }
  #pen .pc { width: 50px; height: 50px; border-radius: 50%; border: 4px solid var(--ink); padding: 0; }
  #pen .pc.on { box-shadow: 0 0 0 5px #FFC93C; transform: scale(1.1); }
  #pen .gap { width: 18px; }
  #pen .dt { width: 54px; height: 54px; border-radius: 14px; border: 4px solid var(--ink); background: #FFFFFF; font-size: 26px; padding: 0; }
  #pen .dt.on { background: #FFC93C; }
  #style { display: flex; gap: 8px; }
  #style button { border: 4px solid var(--ink); border-radius: 30px; background: #FFFFFF; font-size: 20px; font-weight: 800; padding: 6px 16px; }
  #style button.on { background: #FFC93C; }
  #hidesketch { font-size: 22px; }
  #pen .ps { width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--ink); background: #FFFFFF; display: grid; place-items: center; padding: 0; }
  #pen .ps.on { background: #FFE9A8; }
  #pen .ps i { display: block; border-radius: 50%; }
  #retry[hidden] + #retrygap { display: inline-block; } #retry:not([hidden]) + #retrygap { display: none; }
  #cats { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; touch-action: pan-x; flex: none; }
  #cats button { flex: none; border: 3px solid var(--ink); border-radius: 22px; background: #FFFFFF; font-size: 17px; font-weight: 800; padding: 6px 14px; }
  #cats button.on { background: #FFC93C; }
  #builder { position: fixed; inset: 0; z-index: 21; background: #FFFFFF; padding: 16px; overflow: auto; font: 15px system-ui, sans-serif; user-select: text; }
  #builder[hidden] { display: none; }
  #bgrid { display: grid; grid-template-columns: repeat(auto-fill, 128px); gap: 8px; margin-top: 12px; }
  .bcard { border: 3px solid #CCC; border-radius: 10px; padding: 3px; font-size: 11px; text-align: center; cursor: pointer; }
  .bcard canvas { width: 116px; height: 116px; display: block; margin: 0 auto 2px; }
  .bcard.ok { border-color: #3BB273; } .bcard.rejected { border-color: #E5484D; opacity: 0.45; } .bcard.failed { border-color: #F5A623; } .bcard.todo { opacity: 0.4; }
  #lab { position: fixed; inset: 0; z-index: 20; background: #FFFFFF; padding: 16px; overflow: auto; font: 15px system-ui, sans-serif; user-select: text; }
  #lab[hidden] { display: none; }
  .labrow { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; }
  .labrow input { flex: 1; font-size: 17px; padding: 8px; } .labrow button, .labrow select { font-size: 17px; padding: 8px 14px; }
  #labcanvas { border: 1px solid #999; width: 600px; height: 600px; flex: none; } #labout { white-space: pre-wrap; font-size: 12px; margin: 0; max-height: 600px; overflow: auto; }
  .pick.today { background: #FFF2C2; border-color: #D89B00; }
  .pick.surprise { background: #E9DDFF; border-color: #7A4FD6; }
  .pick.surprise .dice { font-size: 64px; line-height: 84px; height: 84px; }
  .pick { position: relative; }
  .pick .drew { position: absolute; top: -8px; right: -8px; font-size: 24px; filter: drop-shadow(0 1px 0 #2B2140); }
  .pickhead { grid-column: 1 / -1; font-size: 22px; font-weight: 900; margin: 6px 2px -2px; color: #6A5A86; }
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  #confetti i { position: absolute; top: -20px; width: 14px; height: 20px; border-radius: 4px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-width: 900px) { #filters { grid-template-columns: 140px; } h1 { font-size: 32px; } #steptext { font-size: 24px; } }
</style>
</head>
<body>
<section id="home">
  <div class="bar"><h1>Draw <span>With Me</span></h1><button class="round" id="sound" aria-label="Sound on or off">🔊</button></div>
  <div id="ask">
    <button id="mic" aria-label="Say what you want to draw">🎤</button>
    <div id="asklabel">What do you want to draw?</div>
    <div id="style" hidden><button data-s="simple">⭐ Simple</button><button data-s="detailed">⭐⭐⭐ Detailed</button></div>
    <div id="heard" aria-live="polite"></div>
  </div>
  <div id="cats" hidden></div>
  <div id="picks"></div>
  <button id="galbar" hidden aria-label="My pictures"><span id="galcount">📷 My pictures</span><span id="galpeek"></span></button>
</section>
<div id="galsheet" hidden>
  <div class="sheet">
    <div class="bar"><button class="round" id="galclose" aria-label="Back">⬅️</button><h2 id="galleryhead">My pictures</h2></div>
    <div id="gallery"></div>
  </div>
</div>
<section id="draw" hidden>
  <div class="bar"><button class="round home" aria-label="Home">🏠</button><h2 id="drawtitle"></h2><button class="round" id="retry" aria-label="Draw it a different way" hidden>🔄</button><span style="width:72px" id="retrygap"></span></div>
  <div id="steptext" aria-live="polite"></div>
  <div id="stepdots"></div>
  <div class="work">
    <div class="rail">
      <div><button class="round" id="again" aria-label="Show me again">👀</button><small>Show me</small></div>
      <div><button class="round" id="helpme" aria-label="Help me draw it">✨</button><small>Help me</small></div>
      <div><button class="round" id="undo" aria-label="Undo">↩️</button><small>Undo</small></div>
    </div>
    <div class="stagebox" id="drawstage">
      <div id="stage"><canvas id="paint"></canvas><canvas id="shade"></canvas><canvas id="sketch"></canvas><canvas id="ink"></canvas><canvas id="guide"></canvas><canvas id="touch"></canvas></div>
    </div>
    <div class="rail"><button class="round" id="next" aria-label="Next step">➜</button></div>
  </div>
  <div id="pen" aria-label="Marker"></div>
</section>
<section id="color" hidden>
  <div class="bar"><button class="round home" aria-label="Home">🏠</button><h2>Color it in!</h2><button class="round" id="done" aria-label="Done coloring">Done ✓</button></div>
  <div class="work">
    <div class="rail">
      <div id="tools">
        <button class="round" data-tool="bucket" aria-label="Paint bucket">🪣</button>
        <button class="round" data-tool="brush" aria-label="Paint brush">🖌️</button>
        <button class="round" data-tool="crayon" aria-label="Crayon">🖍️</button>
        <button class="round" data-tool="glitter" aria-label="Glitter">✨</button>
        <button class="round" data-tool="rainbow" aria-label="Rainbow brush">🌈</button>
        <button class="round" data-tool="eraser" aria-label="Eraser">🧽</button>
        <button class="round" data-tool="shade" aria-label="Shading pencil">🌫️</button>
        <button class="round" data-tool="smudge" aria-label="Smudge">👆</button>
      </div>
    </div>
    <div class="stagebox" id="colorstage"></div>
    <div class="rail">
      <div id="sizes">
        <button data-size="0" aria-label="Thin"><i style="width:10px;height:10px"></i></button>
        <button data-size="1" aria-label="Medium"><i style="width:20px;height:20px"></i></button>
        <button data-size="2" aria-label="Thick"><i style="width:32px;height:32px"></i></button>
      </div>
      <button class="round" id="undo2" aria-label="Undo">↩️</button>
      <button class="round" id="hidesketch" aria-label="Erase the sketch lines" hidden>✏️✖</button>
    </div>
  </div>
  <div id="palette"></div>
</section>
<section id="finish" hidden>
  <div class="bar"><button class="round home" aria-label="Home">🏠</button><h2>Magic filters</h2><button class="round" id="backcolor" aria-label="Back to coloring">🎨</button></div>
  <div class="work">
    <div class="stagebox"><canvas id="result"></canvas></div>
    <div class="rail"><div id="filters"></div><button class="round" id="save" aria-label="Save my picture">⭐ Save</button></div>
  </div>
</section>
<section id="view" hidden>
  <div class="bar"><button class="round" id="viewclose" aria-label="Back">⬅️</button><h2>My picture</h2><button class="round" id="viewdel" aria-label="Delete this picture">🗑️</button></div>
  <canvas id="viewcanvas"></canvas>
</section>
<div id="builder" hidden>
  <b>Draw With Me library builder</b> (makes library.js; tap a thumbnail to reject or restore it)
  <div class="labrow"><input id="bkey" type="password" placeholder="API key"><select id="bmodel"><option value="claude-sonnet-5-5">Sonnet 5.5</option><option value="claude-haiku-4-5-20251001">Haiku 4.5</option><option value="claude-opus-5-5">Opus 5.5</option></select>
    <label><input type="checkbox" id="bsimple" checked> Simple</label><label><input type="checkbox" id="bdetailed" checked> Detailed</label>
    <label>at a time <select id="bconc"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option></select></label></div>
  <div class="labrow"><label>$ per million tokens: in <input id="bpin" value="3" size="4"> out <input id="bpout" value="15" size="4"></label> (edit to match current pricing)</div>
  <div class="labrow"><button id="bstart">Start / resume</button><button id="bpause">Pause</button><button id="bredo">Redo failed and rejected</button><button id="bexport">Export library.js</button><span id="bstats"></span></div>
  <div id="bgrid"></div>
</div>
<div id="lab" hidden>
  <b>Draw With Me lab</b> (try requests; nothing is saved)
  <div class="labrow"><input id="labask" placeholder="a monkey holding a banana"><select id="labstyle"><option value="detailed">Detailed</option><option value="simple">Simple</option></select><select id="labmodel"><option value="claude-sonnet-5-5">Sonnet 5.5</option><option value="claude-haiku-4-5-20251001">Haiku 4.5</option><option value="claude-opus-5-5">Opus 5.5</option></select><button id="labgo">Draw it</button><button id="labuse" hidden>Try drawing it</button></div>
  <div class="labrow"><input id="labkey" type="password" placeholder="API key (from config.js, or paste one here)"></div>
  <div class="labrow"><canvas id="labcanvas" width="600" height="600"></canvas><pre id="labout"></pre></div>
</div>
<div id="thinking" hidden><div class="pencil">✏️</div><div id="thinkingtext"></div></div>
<div id="confetti" hidden></div>
<script src="config.js"></script>
<script src="library.js"></script>
<script>// ---------------------------------------------------------------------------
// The library catalog: what to pre-create (simple and detailed). "name|other ways to say it".
// ---------------------------------------------------------------------------
const CATALOG_SRC = {
  pets: ['cat|kitty|kitten', 'puppy|dog|doggy', 'bunny|rabbit', 'hamster', 'guinea pig', 'goldfish|fish bowl', 'parrot', 'turtle|tortoise', 'kitten playing with yarn|cat with yarn', 'puppy with a bone|dog with a bone', 'mouse|mice', 'pony', 'lizard|gecko', 'ferret', 'hedgehog'],
  farm: ['cow', 'pig|piggy', 'horse', 'sheep|lamb', 'goat', 'chicken|hen', 'rooster', 'baby chick|chick', 'duck|duckling', 'donkey', 'llama', 'barn|red barn', 'tractor', 'farmer', 'scarecrow', 'goose', 'turkey'],

  fantasy: ['unicorn', 'dragon|friendly dragon', 'mermaid', 'fairy', 'castle', 'princess', 'prince', 'knight', 'wizard', 'witch hat|wizard hat', 'magic wand', 'pegasus|flying horse', 'phoenix', 'gnome', 'troll bridge|troll', 'treasure chest', 'pirate', 'pirate ship', 'genie lamp|magic lamp', 'crystal ball', 'rainbow unicorn', 'baby dragon', 'fairy house|mushroom house', 'crown', 'superhero', 'robot', 'alien', 'monster|friendly monster', 'ghost|friendly ghost', 'yeti'],

  space: ['rocket', 'astronaut', 'planet|saturn', 'earth', 'moon', 'sun', 'star', 'shooting star', 'ufo|flying saucer', 'satellite', 'telescope', 'space station', 'comet', 'moon rover', 'constellation'],
  food: ['apple', 'banana', 'strawberry', 'watermelon', 'pineapple', 'cherries', 'grapes', 'orange', 'pear', 'carrot', 'broccoli', 'corn', 'mushroom', 'pumpkin', 'pizza', 'hamburger|burger', 'hot dog', 'taco', 'sandwich', 'french fries|fries', 'donut|doughnut', 'cupcake', 'birthday cake|cake', 'ice cream|ice cream cone', 'popsicle', 'cookie', 'lollipop', 'candy', 'pancakes', 'pretzel', 'sushi', 'avocado', 'lemon', 'egg|fried egg', 'cheese', 'milkshake', 'teapot', 'coffee cup|mug'],
  nature: ['tree', 'palm tree', 'pine tree', 'flower', 'sunflower', 'rose', 'tulip', 'cactus', 'leaf', 'mushroom in the forest', 'mountain', 'volcano', 'rainbow', 'cloud', 'rain cloud|rain', 'lightning', 'snowflake', 'waterfall', 'island', 'beach', 'campfire', 'tent|camping', 'rock|pebble', 'acorn', 'four leaf clover|clover'],

const LESSON_RULES = `You make step-by-step drawing lessons for a five-year-old drawing with a finger on a tablet,
like a page from a children's "how to draw" book: simple shapes, instantly recognizable.

Reply with JSON only:
{"name": "...", "plan": "...", "steps": [{"say": "...", "shapes": [ ... ]}, ...]}
If the request is not suitable for a young child: {"refuse": "<one short kind sentence>", "suggest": "<a similar friendly thing>"}

Write "plan" first (2-4 sentences): name the 3-5 features that make each thing recognizable at a glance
(a monkey: round ears sticking out on the sides, a peanut-shaped face patch, a long curly tail; a banana: a curved crescent with a stem),
then where each part goes on the page and what it attaches to. Then write the steps to match the plan exactly.

The page is 1000 x 1000, x to the right, y DOWN. Keep everything between 80 and 920 and fill most of the page.
Shapes (numbers only):
  {"circle":[cx,cy,r]}   {"oval":[cx,cy,rx,ry,tilt]} (tilt in degrees, optional)   {"line":[x1,y1,x2,y2]}
  {"curve":[x1,y1,bendX,bendY,x2,y2]} (a smooth curve pulled toward the bend point)
  {"lines":[[x,y],[x,y],...]} (connected lines)   {"shape":[[x,y],...]} (closed outline)   {"arc":[cx,cy,r,fromDeg,toDeg]} (0 = right, 90 = down)
Rules:
- 3 to 7 steps, at most 6 shapes per step. Step 1 is the biggest main shape (usually the body or head).
- Parts must connect: start a leg, arm or tail ON the edge of the body (compute the edge point), not floating near it.
- Things that are held go next to the hand that holds them, and the hand touches them.
- Get proportions right: heads are big and cute; eyes sit inside the face; nothing important is tiny.
- "say" is at most 12 easy words and starts with Draw or Add.
- Honor the describing words: size ("giant" fills the page), counts ("three eyes"), things worn or held.
  Colors are for coloring in later, so they change nothing in the shapes.
- Friendly and cute. Nothing scary or gross. No text or letters in the drawing.`;
const LESSON_EXAMPLE = JSON.stringify(SHAPE_EXAMPLE);
const DETAILED_RULES = `You make DETAILED step-by-step drawing lessons, like a page from a "how to draw" book for older kids:
construction sketch, then smooth outlines, then details, then shading. Drawn with a finger on a tablet.

Reply with JSON only:
{"name": "...", "style": "detailed", "plan": "...", "steps": [{"say": "...", "tool": "...", ...}, ...]}
If the request is not suitable for a young child: {"refuse": "<one short kind sentence>", "suggest": "<a similar friendly thing>"}

Write "plan" first (3-5 sentences): the 3-5 features that make each thing recognizable at a glance, the layout
(where each part goes, what it attaches to, proportions), and where the light comes from (top left).

The page is 1000 x 1000, x right, y DOWN. Keep everything between 60 and 940 and fill most of the page.
Shapes (numbers only):
  {"circle":[cx,cy,r]}  {"oval":[cx,cy,rx,ry,tilt]}  {"line":[x1,y1,x2,y2]}  {"curve":[x1,y1,bendX,bendY,x2,y2]}
  {"smooth":[[x,y],...]} a smooth curve through 3-30 points   {"smoothshape":[[x,y],...]} a smooth closed outline through 4-40 points
  {"lines":[[x,y],...]}  {"shape":[[x,y],...]}  {"arc":[cx,cy,r,fromDeg,toDeg]}
Steps (6 to 12):

    (cheeks, fluffy edges, paws, the bend of a tail), NOT plain circles. Draw over the sketch shapes.

    Shade the side away from the light (bottom right of round forms), under overlapping parts, and a dark shadow on the ground.
- At most 12 shapes per step. Parts must connect: limbs start ON the body edge. Held things touch the hand.
- "say": at most 16 easy words, starting with Sketch, Draw, Add or Shade.
- Honor the describing words (size, counts, things worn or held). Colors are for coloring later.

const DETAILED_EXAMPLE_JSON = JSON.stringify(DETAILED_EXAMPLE);
let drawStyle = (() => { try { return localStorage.getItem('drawwithme-style') || 'simple'; } catch (e) { return 'simple'; } })();

// Everything Claude sends back is checked before she sees it.
function checkLesson(raw, asked) {
  let j;
  try { j = JSON.parse(String(raw).replace(/^[^{]*/, '').replace(/[^}]*$/, '')); } catch (e) { return { error: 'not json' }; }
  if (j.refuse) return { refuse: String(j.refuse).slice(0, 160), suggest: j.suggest ? String(j.suggest).slice(0, 40) : null };
  if (!Array.isArray(j.steps) || j.steps.length < 2) return { error: 'step count' };
  const steps = [];
  if (j.steps.length > 13) return { error: 'step count' };
  for (const st of j.steps) {
    const say = String(st.say || '').trim();
    if (!say || say.length > 140) return { error: 'step size' };
    const tool = ['sketch', 'pen', 'charcoal', 'shade'].includes(st.tool) ? st.tool : 'pen';
    if (st.shade && typeof st.shade === 'object') {
      const area = shapeToPath(st.shade.area || {});
      if (!area || shapePoints(st.shade.area).some(([x, y]) => !(x >= -20 && x <= 1020 && y >= -20 && y <= 1020))) return { error: 'bad shade area' };
      const tone = ['light', 'medium', 'dark'].includes(st.shade.tone) ? st.shade.tone : 'medium';
      const angle = Number.isFinite(+st.shade.angle) ? +st.shade.angle : 45;
      steps.push({ say, tool: 'shade', path: '', shade: { area, tone, angle } });
      continue;
    }
    if (!Array.isArray(st.shapes) || !st.shapes.length || st.shapes.length > 14) return { error: 'step size' };
    const parts = [];
    for (const sh of st.shapes) {
      const d = shapeToPath(sh || {});
      if (!d) return { error: 'bad shape' };
      if (shapePoints(sh).some(([x, y]) => !(x >= -20 && x <= 1020 && y >= -20 && y <= 1020))) return { error: 'off the page' };
      parts.push(d);
    }
    const path = parts.join(' ');
    try { new Path2D(path); } catch (e) { return { error: 'bad path' }; }
    const L = pathLen(path);
    if (!(L > 5) || L > 30000) return { error: 'path length' };
    steps.push({ say, path, tool });
  }
  const name = String(j.name || asked).trim().slice(0, 40) || asked;
  const style = j.style === 'detailed' || steps.some(s => s.tool === 'shade' || s.tool === 'sketch') ? 'detailed' : 'simple';
  return { subject: { id: 'learned-' + Date.now(), v: LESSON_VERSION, style, cat: 'new', name: name.charAt(0).toUpperCase() + name.slice(1), words: [asked.toLowerCase()], steps, learned: true, asked } };
}

async function learnDrawing(asked, opts = {}) {
  const key = opts.key || CFG.apiKey, model = opts.model || CFG.model, style = opts.style || drawStyle;
  if (!key || !asked) return { error: 'off' };
  if (!navigator.onLine) return { error: 'offline' };
  if (!opts.lab && learnedToday() >= CFG.dailyLimit) return { error: 'limit' };
  const t0 = performance.now();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: ctl.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model, max_tokens: style === 'detailed' ? 6000 : 3000,
        system: style === 'detailed' ? DETAILED_RULES + '\nAn example:\n' + DETAILED_EXAMPLE_JSON : LESSON_RULES + '\nAn example:\n' + LESSON_EXAMPLE,
        messages: [{ role: 'user', content: 'Make a drawing lesson for: ' + asked }] })
    });
    if (!r.ok) return { error: 'http ' + r.status };
    const data = await r.json();
    if (!opts.lab) countLearned();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    return Object.assign(checkLesson(text, asked), { raw: text, usage: data.usage, ms: Math.round(performance.now() - t0) });
  } catch (e) { return { error: e.name === 'AbortError' ? 'timeout' : 'network' }; }
  finally { clearTimeout(timer); }
}

// Learned drawings join the library (so saying it again is instant and offline).
function addLearned(s) {
  if (!SUBJECTS.some(x => x.id === s.id)) SUBJECTS.unshift(s);
}
async function tryToLearn(heardText, replaceId) {
  const asked = replaceId ? heardText : askedFor(heardText);
  const thinking = $('thinking');
  $('thinkingtext').textContent = 'Let me think how to draw ' + (asked ? 'a ' + asked : 'that') + '…';
  thinking.hidden = false; say('Ooh! Let me think how to draw ' + (asked ? 'a ' + asked : 'that') + '.');
  const res = await learnDrawing(asked);
  thinking.hidden = true;
  if (res.subject) {
    const list = loadLearned().filter(x => x.id !== replaceId); list.unshift(res.subject); saveLearned(list.slice(0, 60));
    if (replaceId) { const i = SUBJECTS.findIndex(x => x.id === replaceId); if (i >= 0) SUBJECTS.splice(i, 1); }
    addLearned(res.subject); rebuildPicks();
    startDrawing(res.subject);
    return;
  }
  let msg;
  if (res.refuse) msg = res.refuse + (res.suggest ? ' How about a ' + res.suggest + '?' : '');
  else if (res.error === 'limit') msg = 'That’s lots of new drawings today! Pick one of these.';
  else if (res.error === 'offline' || res.error === 'network' || res.error === 'timeout') msg = 'I can’t learn new drawings right now. Pick one of these!';
  else msg = 'Hmm, I couldn’t figure out ' + (asked ? 'a ' + asked : 'that') + '. Pick one of these!';
  setMicState('ready', msg); say(msg);
}

// Canvases: paint (bottom), her lines (middle), the guide (top, not saved).

  const st = $('stage'), box = st.parentElement.getBoundingClientRect();

// Drawing and painting with her finger

  if (shown.length > 1) {
    // Drawing of the day: the same one all day (so it feels like a thing), different tomorrow.
    const day = Math.floor(Date.now() / 86400000), today = shown[day % shown.length];
    const tb = document.createElement('button'); tb.className = 'pick today'; tb.setAttribute('aria-label', 'Drawing of the day: ' + today.name);
    tb.appendChild(thumb(today, 84));
    const tt = document.createElement('span'); tt.textContent = 'Today: ' + today.name; tb.appendChild(tt);
    tb.addEventListener('click', () => { say('Today we draw a ' + today.name.toLowerCase() + '!'); startDrawing(today); });
    grid.appendChild(tb);
    // Surprise me: a random one she has not drawn yet, if any are left.
    const sb = document.createElement('button'); sb.className = 'pick surprise'; sb.setAttribute('aria-label', 'Surprise me');
    const dice = document.createElement('div'); dice.className = 'dice'; dice.textContent = '\u{1F3B2}'; sb.appendChild(dice);
    const st = document.createElement('span'); st.textContent = 'Surprise me!'; sb.appendChild(st);
    sb.addEventListener('click', () => {
      const fresh = shown.filter(s => !drawn.has(s.name)), from = fresh.length ? fresh : shown;
      const s = from[Math.floor(Math.random() * from.length)];
      say('Surprise! Let\'s draw a ' + s.name.toLowerCase() + '!'); startDrawing(s);
    });
    grid.appendChild(sb);
  }
  if (learned.length && rest.length) group('New drawings');
  for (const s of [...learned, ...rest]) {
    if (s === rest[0] && learned.length) group('More drawings');
    const b = document.createElement('button'); b.className = 'pick'; b.setAttribute('aria-label', s.name + (drawn.has(s.name) ? ', you drew this' : ''));
    b.appendChild(thumb(s, 84));
    const t = document.createElement('span'); t.textContent = s.name; b.appendChild(t);
    if (drawn.has(s.name)) { const star = document.createElement('span'); star.className = 'drew'; star.textContent = '\u2B50'; b.appendChild(star); }
    b.addEventListener('click', () => startDrawing(s));
    grid.appendChild(b);
  }
}


// ---------------------------------------------------------------------------
// Lab (grown-ups only: open the page with ?lab). Try any request against a model and
// see the result immediately, without saving it or touching her daily count.
// ---------------------------------------------------------------------------
function startLab() {
  const el = $('lab'); el.hidden = false;
  $('labkey').value = CFG.apiKey || '';
  $('labmodel').value = CFG.model;
  $('labgo').onclick = async () => {
    const asked = $('labask').value.trim(); if (!asked) return;
    $('labout').textContent = 'Asking ' + $('labmodel').value + '…';
    const res = await learnDrawing(asked, { key: $('labkey').value.trim(), model: $('labmodel').value, lab: true, style: $('labstyle').value });
    const u = res.usage || {};
    $('labout').textContent = (res.subject ? 'OK' : 'Rejected: ' + (res.error || res.refuse)) +
      (res.ms ? `  |  ${(res.ms / 1000).toFixed(1)} s, ${u.input_tokens || '?'} in / ${u.output_tokens || '?'} out tokens` : '') + '\n\n' + (res.raw || '');
    const c = $('labcanvas'), g = c.getContext('2d'); c.width = c.height = 600; g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 600, 600);
    if (res.subject) {
      g.save(); g.scale(0.6, 0.6); g.lineCap = g.lineJoin = 'round';
      res.subject.steps.forEach((st, i) => {
        if (st.shade) { g.save(); g.clip(new Path2D(st.shade.area)); g.fillStyle = `rgba(60,58,72,${TONES[st.shade.tone]})`; g.fillRect(0, 0, 1000, 1000); g.restore(); return; }
        g.strokeStyle = st.tool === 'sketch' ? 'rgba(90,95,110,0.4)' : '#222'; g.lineWidth = st.tool === 'sketch' ? 5 : 9; g.stroke(new Path2D(st.path)); });
      g.restore();
      $('labuse').hidden = false;
      $('labuse').onclick = () => { $('lab').hidden = true; startDrawing(res.subject); };
    } else $('labuse').hidden = true;
  };
}

// ---------------------------------------------------------------------------
// Library builder (grown-ups, on a PC: open with ?lab&build). Makes simple and detailed
// lessons for everything in the catalog, a few at a time; progress is kept in the browser
// so it can be paused and resumed; review the thumbnails, tap a bad one to reject it,
// redo, and export library.js to put beside the app.
// ---------------------------------------------------------------------------
const BuildDB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, bad) => { const r = indexedDB.open('drawwithme-build', 1); r.onupgradeneeded = () => r.result.createObjectStore('items'); r.onsuccess = () => ok(this.db = r.result); r.onerror = () => bad(r.error); }); },
  async all() { const db = await this.open(); return new Promise(ok => { const out = {}; const t = db.transaction('items').objectStore('items').openCursor(); t.onsuccess = () => { const c = t.result; if (c) { out[c.key] = c.value; c.continue(); } else ok(out); }; }); },
  async put(k, v) { const db = await this.open(); return new Promise(ok => { const t = db.transaction('items', 'readwrite'); t.objectStore('items').put(v, k); t.oncomplete = ok; }); }
};
async function startBuilder() {
  const el = $('builder'); el.hidden = false; $('lab').hidden = true;
  $('bkey').value = CFG.apiKey || ''; $('bmodel').value = CFG.model;
  let items = await BuildDB.all(), running = false;
  const key = (c, st) => c.id + '|' + st;
  const styles = () => ['simple', 'detailed'].filter(st => $('b' + st).checked);
  const jobs = () => CATALOG.flatMap(c => styles().map(st => ({ c, st, k: key(c, st) })));
  function cost() {
    let i = 0, o = 0; for (const v of Object.values(items)) if (v.usage) { i += v.usage.input_tokens || 0; o += v.usage.output_tokens || 0; }
    return (i / 1e6) * +$('bpin').value + (o / 1e6) * +$('bpout').value;
  }
  function card(j) {
    let d = document.getElementById('bc-' + j.k);
    if (!d) { d = document.createElement('div'); d.className = 'bcard'; d.id = 'bc-' + j.k; d.innerHTML = '<canvas width="240" height="240"></canvas><span></span>';
      d.addEventListener('click', async () => { const v = items[j.k]; if (!v || (v.status !== 'ok' && v.status !== 'rejected')) return; v.status = v.status === 'ok' ? 'rejected' : 'ok'; await BuildDB.put(j.k, v); card(j); stats(); });
      $('bgrid').appendChild(d); }
    const v = items[j.k], g = d.querySelector('canvas').getContext('2d');
    d.className = 'bcard ' + (v ? v.status : 'todo');
    d.querySelector('span').textContent = j.c.name + (j.st === 'detailed' ? ' ★' : '');
    d.title = v && v.error ? v.error : '';
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 240, 240);
    if (v && v.steps) {
      g.save(); g.scale(0.24, 0.24); g.lineCap = g.lineJoin = 'round';
      for (const st of v.steps) {
        if (st.shade) { g.save(); g.clip(new Path2D(st.shade.area)); g.fillStyle = `rgba(60,58,72,${TONES[st.shade.tone] || 0.3})`; g.fillRect(0, 0, 1000, 1000); g.restore(); continue; }
        g.strokeStyle = st.tool === 'sketch' ? 'rgba(90,95,110,0.35)' : '#222'; g.lineWidth = st.tool === 'sketch' ? 5 : 10; g.stroke(new Path2D(st.path));
      }
      g.restore();
    }
  }
  function stats() {
    const js = jobs(), n = { ok: 0, rejected: 0, failed: 0 };
    for (const j of js) { const v = items[j.k]; if (v) n[v.status] = (n[v.status] || 0) + 1; }
    $('bstats').textContent = `${n.ok} good, ${n.rejected} rejected, ${n.failed} failed, ${js.length - n.ok - n.rejected - n.failed} to go, of ${js.length}  |  about $${cost().toFixed(2)} so far`;
  }
  function render() { $('bgrid').innerHTML = ''; for (const j of jobs()) card(j); stats(); }
  async function run(filter) {
    if (running) return; running = true; $('bstart').disabled = $('bredo').disabled = true;
    const queue = jobs().filter(filter), workers = +$('bconc').value;
    const work = async () => {
      while (running && queue.length) {
        const j = queue.shift();
        const res = await learnDrawing(j.c.name.toLowerCase(), { key: $('bkey').value.trim(), model: $('bmodel').value, style: j.st, lab: true });
        items[j.k] = res.subject ? { status: 'ok', steps: res.subject.steps, usage: res.usage } : { status: 'failed', error: res.error || res.refuse || 'failed', usage: res.usage };
        await BuildDB.put(j.k, items[j.k]); card(j); stats();
      }
    };
    await Promise.all(Array.from({ length: workers }, work));
    running = false; $('bstart').disabled = $('bredo').disabled = false;
  }
  $('bstart').onclick = () => run(j => !items[j.k]);
  $('bredo').onclick = () => run(j => items[j.k] && (items[j.k].status === 'failed' || items[j.k].status === 'rejected'));
  $('bpause').onclick = () => { running = false; };
  $('bsimple').onchange = $('bdetailed').onchange = render;
  $('bexport').onclick = () => {
    const out = [];
    for (const c of CATALOG) for (const st of ['simple', 'detailed']) {
      const v = items[key(c, st)];
      if (v && v.status === 'ok') out.push({ id: c.id + '-' + st, name: c.name, words: c.words, cat: c.cat, style: st, steps: v.steps });
    }
    const text = '// Draw With Me library: ' + out.length + ' lessons, made ' + new Date().toISOString().slice(0, 10) + '\nwindow.DWM_LIBRARY = ' + JSON.stringify(out) + ';\n';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' })); a.download = 'library.js';
    document.body.appendChild(a); a.click(); a.remove();
    $('bstats').textContent = 'Exported ' + out.length + ' lessons to library.js';
    window.__lastExport = text;
  };
  render();
}
