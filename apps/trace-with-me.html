<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace With Me</title>
<!--
  Trace With Me. Handwriting from first letters to joined cursive. One file, no network, no API.
  Three modes:
    Little   the original decks: capital letters, small letters, numbers and shapes to colour in with a finger.
    Spell    a word is spoken (with a picture clue). She traces it letter by letter in school print, then writes it
             from memory in letter boxes; each box is read by a small built-in letter matcher. Eight levels, from short
             vowel words to tricky 3rd grade words (because, friend, laugh).
    Cursive  lowercase cursive drawn from stroke paths (no fonts): single letters in their teaching groups with a
             "watch me" pen, then joined words, then words with only a light guide.
  Spell and Cursive move up a level after four right first try in a row and down after two missed in a row.
  Progress is kept in localStorage (key trace-v2); the Little sticker board keeps its old key (tracer-stickers).
-->
<style>
  :root { --ink: #2B2140; --paper: #FFF9F0; --accent: #FF4F8B; --sun: #FFC93C; --sky: #58C7F0; --leaf: #5CD38B; --grape: #9B6BFF; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; color: var(--ink); }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* The right 210px of the header stays clear: the Home pill sits there. */
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 210px 10px 14px; }
  header h1 { font-size: 26px; margin: 0; font-weight: 900; }
  .decks { display: flex; gap: 8px; }
  .deck, .mode { border: 3px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 16px; font-size: 20px; font-weight: 800; cursor: pointer; }
  .deck.on, .mode.on { background: var(--sun); }
  #badge { font-size: 17px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  #stars { font-size: 22px; font-weight: 900; margin-left: auto; }
  .hide { display: none !important; }
  main { position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas#c { background: #fff; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 #E7DCCF; touch-action: none; max-width: 100%; max-height: 100%; aspect-ratio: 1 / 1; }
  #wide { position: absolute; inset: 8px 14px 4px; }
  canvas#w { width: 100%; height: 100%; background: #fff; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 #E7DCCF; touch-action: none; box-sizing: border-box; display: block; }
  #word { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font-size: 30px; font-weight: 900; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; pointer-events: none; white-space: nowrap; z-index: 2; }
  #meter { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 46%; height: 22px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; pointer-events: none; z-index: 2; }
  #meter i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .15s; }
  footer { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 14px 16px; }
  footer button { border: 4px solid var(--ink); background: #fff; border-radius: 50%; width: 76px; height: 76px; font-size: 34px; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
  footer button:active { transform: scale(.93); }
  footer button.big { width: 92px; height: 92px; background: var(--sun); }
  footer button:disabled { opacity: .35; }
  #win { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; z-index: 5; }
  #win.on { display: grid; }
  #win .card { background: #fff; border: 4px solid var(--ink); border-radius: 28px; padding: 22px 36px; font-size: 44px; font-weight: 900; text-align: center; box-shadow: 0 12px 0 var(--accent); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  #win .card small { display: block; font-size: 60px; margin-top: 6px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .spark { position: absolute; font-size: 44px; animation: fly 1.1s ease-out forwards; pointer-events: none; z-index: 6; }
  @keyframes fly { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(40deg); opacity: 0; } }
  #board { position: fixed; inset: 0; background: rgba(43,33,64,.85); display: none; padding: 24px; overflow: auto; z-index: 10; }
  #board.on { display: block; }
  #board .sheet { background: var(--paper); border-radius: 28px; padding: 20px; max-width: 900px; margin: 0 auto; }
  #board h2 { margin: 0 0 12px; font-size: 30px; }
  #stickers { display: grid; grid-template-columns: repeat(auto-fill, 86px); gap: 10px; }
  #stickers div { width: 86px; height: 86px; border-radius: 18px; background: #fff; border: 3px dashed #cfc5b8; display: grid; place-items: center; font-size: 44px; }
  #stickers div.got { border: 3px solid var(--ink); background: var(--sun); }
  #stickers div.got::after { content: attr(data-l); position: relative; margin-top: -78px; margin-left: 58px; font-size: 16px; font-weight: 900; background: #fff; border-radius: 999px; padding: 0 6px; }
  #board button { margin-top: 14px; }
  #boardNote { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Trace With Me</h1>
    <button class="mode" data-mode="little">Little</button>
    <button class="mode" data-mode="spell">Spell</button>
    <button class="mode" data-mode="cursive">Cursive</button>
    <div class="decks" id="decks">
      <button class="deck on" data-deck="upper">ABC</button>
      <button class="deck" data-deck="lower">abc</button>
      <button class="deck" data-deck="numbers">123</button>
      <button class="deck" data-deck="shapes">&#9711;&#9634;&#9651;</button>
    </div>
    <span id="badge" class="hide"></span>
    <span id="stars"></span>
  </header>
  <main>
    <div id="stage"><canvas id="c" width="1000" height="1000"></canvas></div>
    <div id="wide" class="hide"><canvas id="w"></canvas></div>
    <div id="word"></div>
    <div id="meter"><i></i></div>
    <div id="win"><div class="card"><span id="winText"></span><small id="winEmoji"></small></div></div>
  </main>
  <footer>
    <button id="prev" title="Back">&#9664;</button>
    <button id="hear" title="Hear it">&#128264;</button>

    <button id="board-btn" title="My stickers">&#11088;</button>

  </footer>
</div>
<div id="board"><div class="sheet"><h2>My stickers</h2><p id="boardNote"></p><div id="stickers"></div><button class="deck" id="board-close">Back to tracing</button></div></div>
<script id="voicepack">/* voice pack goes here: run voices/make-voices.py */</script>
<script>
// ---------------------------------------------------------------------------
// Voice clips. If a voice pack is present (window.VOICE_PACK: phrase -> base64 MP3, made by voices/make-voices.py),
// a phrase is played from its clip through Web Audio; otherwise the Windows voice reads it. Bytes are decoded in
// memory (no data: or blob: URLs, which the kiosk blocks).
// ---------------------------------------------------------------------------
const VOICE = (() => {
  let actx = null, cur = null; const decoded = new Map();
  const key = t => String(t).trim().toLowerCase().replace(/\s+/g, ' ');
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  function stop() { if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } }
  function has(t) { const p = window.VOICE_PACK; return !!(p && p[key(t)]); }
  function play(t, done) {
    const p = window.VOICE_PACK, k = key(t); if (!p || !p[k]) return false;
    const a = ctx(); if (!a) return false;
    const go = (buf) => { stop(); const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination); s.onended = () => { if (cur === s) { cur = null; if (done) done(); } }; cur = s; s.start(); };
    try {
      if (decoded.has(k)) { go(decoded.get(k)); return true; }
      const bin = atob(p[k]), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      a.decodeAudioData(bytes.buffer.slice(0)).then(buf => { decoded.set(k, buf); go(buf); }).catch(() => { if (done) done(); });
      return true;
    } catch (e) { return false; }
  }
  return { play, stop, has, key };
})();

function say(text) {
  try { speechSynthesis.cancel(); } catch (e) {}
  VOICE.stop(); if (VOICE.play(text)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
}
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ===========================================================================
// LITTLE: the original decks (colour in a big letter, number or shape).
// ===========================================================================
const WORDS = { A: ['apple', '🍎'], B: ['bear', '🐻'], C: ['cat', '🐱'], D: ['dog', '🐶'], E: ['egg', '🥚'], F: ['fish', '🐟'], G: ['grapes', '🍇'],
  H: ['hat', '🎩'], I: ['ice cream', '🍦'], J: ['jellyfish', '🪼'], K: ['kite', '🪁'], L: ['lion', '🦁'], M: ['moon', '🌙'], N: ['nest', '🪺'],
  O: ['octopus', '🐙'], P: ['pig', '🐷'], Q: ['queen', '👸'], R: ['rainbow', '🌈'], S: ['sun', '☀️'], T: ['turtle', '🐢'], U: ['umbrella', '☂️'],
  V: ['violin', '🎻'], W: ['whale', '🐳'], X: ['xylophone', '🎹'], Y: ['yarn', '🧶'], Z: ['zebra', '🦓'] };
const NUMBERS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const SHAPES = [
  { id: 'circle', name: 'circle', emoji: '⚽', path: g => { g.arc(500, 500, 330, 0, Math.PI * 2); } },
  { id: 'square', name: 'square', emoji: '🎁', path: g => { g.rect(190, 190, 620, 620); } },
  { id: 'triangle', name: 'triangle', emoji: '🍕', path: g => { g.moveTo(500, 150); g.lineTo(850, 820); g.lineTo(150, 820); g.closePath(); } },
  { id: 'heart', name: 'heart', emoji: '❤️', path: g => { g.moveTo(500, 840); g.bezierCurveTo(120, 560, 150, 200, 390, 230); g.bezierCurveTo(460, 240, 490, 300, 500, 340); g.bezierCurveTo(510, 300, 540, 240, 610, 230); g.bezierCurveTo(850, 200, 880, 560, 500, 840); } },
  { id: 'star', name: 'star', emoji: '⭐', path: g => { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 150 : 360; g[i ? 'lineTo' : 'moveTo'](500 + r * Math.cos(a), 520 + r * Math.sin(a)); } g.closePath(); } },
  { id: 'diamond', name: 'diamond', emoji: '💎', path: g => { g.moveTo(500, 140); g.lineTo(840, 500); g.lineTo(500, 860); g.lineTo(160, 500); g.closePath(); } }
];
const DECKS = {
  upper: Object.keys(WORDS).map(l => ({ id: 'U' + l, glyph: l, say: `Trace the letter ${l}.`, done: `${l} is for ${WORDS[l][0]}!`, emoji: WORDS[l][1], label: l })),
  lower: Object.keys(WORDS).map(l => ({ id: 'L' + l, glyph: l.toLowerCase(), say: `Trace the small letter ${l}.`, done: `Small ${l}, for ${WORDS[l][0]}!`, emoji: WORDS[l][1], label: l.toLowerCase() })),
  numbers: NUMBERS.map((w, n) => ({ id: 'N' + n, glyph: String(n), say: `Trace the number ${w}.`, done: n === 0 ? 'Zero! Nothing at all.' : `${w.charAt(0).toUpperCase() + w.slice(1)}! ` + 'Count them: ' + Array.from({ length: n }, (_, i) => NUMBERS[i + 1]).join(', ') + '.', emoji: n === 0 ? '🫧' : '🍓'.repeat(n), label: String(n) })),
  shapes: SHAPES.map(s => ({ id: 'S' + s.id, shape: s, say: `Trace the ${s.name}.`, done: `A ${s.name}!`, emoji: s.emoji, label: '' }))
};
const FONT = '900 820px "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif';
const DONE_AT = 0.72;          // coverage needed to win
const BRUSH = 72;              // her finger line, in page units

let deck = 'upper', idx = 0, won = false, nudged = false, last = null;
const cv = $('c'), g = cv.getContext('2d');
const ink = document.createElement('canvas'); ink.width = ink.height = 1000; const ig = ink.getContext('2d');
const mask = document.createElement('canvas'); mask.width = mask.height = 1000; const mg = mask.getContext('2d');
let samples = [], outside = [];
const meter = document.querySelector('#meter i'), wordEl = $('word');
const SKEY = 'tracer-stickers';
function loadStickers() { try { return JSON.parse(localStorage.getItem(SKEY) || '[]'); } catch (e) { return []; } }
function saveSticker(id) { const s = loadStickers(); if (!s.includes(id)) { s.push(id); try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {} } }
function item() { return DECKS[deck][idx]; }

function buildMask() {
  mg.clearRect(0, 0, 1000, 1000); mg.fillStyle = '#000'; mg.strokeStyle = '#000';
  const it = item();
  if (it.shape) { mg.lineWidth = 120; mg.lineJoin = mg.lineCap = 'round'; mg.beginPath(); it.shape.path(mg); mg.stroke(); }
  else {
    mg.font = FONT; mg.textAlign = 'center'; mg.textBaseline = 'middle';
    let size = 820; const w = mg.measureText(it.glyph).width; if (w > 780) size = Math.floor(820 * 780 / w);
    mg.font = FONT.replace('820px', size + 'px');
    mg.fillText(it.glyph, 500, it.glyph === it.glyph.toLowerCase() && /[gjpqy]/.test(it.glyph) ? 430 : 500);
  }
  const d = mg.getImageData(0, 0, 1000, 1000).data; samples = []; outside = [];
  for (let y = 10; y < 1000; y += 12) for (let x = 10; x < 1000; x += 12) (d[(y * 1000 + x) * 4 + 3] > 128 ? samples : outside).push([x, y]);
}
function renderLittle() {
  g.clearRect(0, 0, 1000, 1000);
  g.save(); g.globalAlpha = 0.18; g.drawImage(mask, 0, 0); g.restore();
  g.save(); g.setLineDash([22, 18]); g.lineWidth = 7; g.strokeStyle = '#9B6BFF'; g.lineJoin = g.lineCap = 'round';
  const it = item();
  if (it.shape) { g.beginPath(); it.shape.path(g); g.stroke(); }
  else { g.font = mg.font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.strokeText(it.glyph, 500, it.glyph === it.glyph.toLowerCase() && /[gjpqy]/.test(it.glyph) ? 430 : 500); }
  g.restore();
  g.drawImage(ink, 0, 0);
}
function coverage() {
  if (!samples.length) return { on: 0, off: 0 };
  const d = ig.getImageData(0, 0, 1000, 1000).data; let hit = 0, miss = 0;
  for (const [x, y] of samples) if (d[(y * 1000 + x) * 4 + 3] > 40) hit++;
  for (const [x, y] of outside) if (d[(y * 1000 + x) * 4 + 3] > 40) miss++;
  return { on: hit / samples.length, off: miss / Math.max(1, hit) };
}
function loadLittle(i, speak = true) {
  idx = (i + DECKS[deck].length) % DECKS[deck].length; won = false; nudged = false;
  ig.clearRect(0, 0, 1000, 1000); meter.style.width = '0';
  $('win').classList.remove('on');
  buildMask(); renderLittle();
  const it = item();
  wordEl.textContent = it.shape ? it.shape.name : (it.label + '  ' + (it.emoji.length > 4 ? '' : it.emoji));
  if (speak) say(it.say);
}
let activeId = null;
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1000, (e.clientY - r.top) / r.height * 1000]; }
cv.addEventListener('pointerdown', e => { if (activeId !== null || won) return; activeId = e.pointerId; cv.setPointerCapture(e.pointerId); last = pos(e); dot(last); });
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== activeId) return;
  const p = pos(e);
  ig.strokeStyle = colorFor(); ig.lineWidth = BRUSH; ig.lineCap = ig.lineJoin = 'round';
  ig.beginPath(); ig.moveTo(last[0], last[1]); ig.lineTo(p[0], p[1]); ig.stroke(); last = p; renderLittle();
});
function dot(p) { ig.fillStyle = colorFor(); ig.beginPath(); ig.arc(p[0], p[1], BRUSH / 2, 0, Math.PI * 2); ig.fill(); renderLittle(); }
function endStroke(e) {
  if (e.pointerId !== activeId) return; activeId = null;
  const c = coverage(); meter.style.width = Math.round(Math.min(1, c.on / DONE_AT) * 100) + '%';
  if (c.on >= DONE_AT && c.off <= 1.0) winLittle();
  else if (c.on >= DONE_AT && !nudged) { nudged = true; say('Try to stay inside the ' + (item().shape ? item().shape.name : 'letter') + '. Tap the drop to start over.'); }
}
cv.addEventListener('pointerup', endStroke); cv.addEventListener('pointercancel', endStroke);
const COLORS = ['#FF4F8B', '#58C7F0', '#5CD38B', '#FFC93C', '#9B6BFF', '#FF8C42'];
function colorFor() { return COLORS[idx % COLORS.length]; }
function sparkle() {
  const host = document.querySelector('main');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = ['⭐', '✨', '🌟', '💫'][i % 4];
    s.style.left = '50%'; s.style.top = '50%'; s.style.setProperty('--dx', (Math.random() * 700 - 350) + 'px'); s.style.setProperty('--dy', (Math.random() * 500 - 250) + 'px');
    host.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}
function winLittle() {
  won = true; const it = item(); saveSticker(it.id);
  $('winText').textContent = it.done; $('winEmoji').textContent = it.emoji; $('win').classList.add('on');
  say('You did it! ' + it.done); sparkle();
  setTimeout(() => { if (won && mode === 'little') loadLittle(idx + 1); }, 3200);
}

// ===========================================================================
// LETTER SHAPES. Units: top line y=0, midline y=100, baseline y=200, descender line y=300.
// Print letters are school ball-and-stick strokes (in stroke order). Cursive letters are one joined body stroke
// (plus dots and crosses); joins between letters are made by connect().
// ===========================================================================
const PRINT = {
  a: { w: 105, d: ['M97 134 A48 48 0 1 0 97 166', 'M100 100 V200'] },
  b: { w: 110, d: ['M10 0 V200', 'M13 134 A48 48 0 1 1 13 166'] },
  c: { w: 95, d: ['M89 119 A48 48 0 1 0 89 181'] },
  d: { w: 105, d: ['M97 134 A48 48 0 1 0 97 166', 'M100 0 V200'] },
  e: { w: 105, d: ['M6 150 H100 A48 48 0 1 0 90 180'] },
  f: { w: 90, d: ['M88 22 C75 0 40 0 40 40 V200', 'M10 100 H75'] },
  g: { w: 105, d: ['M97 134 A48 48 0 1 0 97 166', 'M100 100 V260 C100 305 40 305 15 280'] },
  h: { w: 105, d: ['M10 0 V200', 'M10 145 C18 105 92 95 95 145 V200'] },
  i: { w: 60, d: ['M30 100 V200', 'M30 52 L30 56'] },
  j: { w: 70, d: ['M55 100 V265 C55 305 15 305 2 282', 'M55 52 L55 56'] },
  k: { w: 95, d: ['M10 0 V200', 'M85 100 L12 160', 'M38 140 L90 200'] },
  l: { w: 50, d: ['M25 0 V200'] },
  m: { w: 140, d: ['M10 100 V200', 'M10 140 C14 105 62 98 68 140 V200', 'M68 140 C72 105 122 98 128 140 V200'] },
  n: { w: 105, d: ['M10 100 V200', 'M10 145 C18 105 92 95 95 145 V200'] },
  o: { w: 105, d: ['M52 102 A48 48 0 0 0 52 198 A48 48 0 0 0 52 102'] },
  p: { w: 110, d: ['M10 100 V300', 'M13 134 A48 48 0 1 1 13 166'] },
  q: { w: 125, d: ['M97 134 A48 48 0 1 0 97 166', 'M100 100 V300 L122 282'] },
  r: { w: 90, d: ['M10 100 V200', 'M10 145 C18 108 55 98 85 112'] },
  s: { w: 92, d: ['M85 116 C72 96 15 96 15 126 C15 152 85 146 85 174 C85 206 20 206 5 184'] },
  t: { w: 85, d: ['M40 20 V180 C40 202 62 204 78 192', 'M8 100 H75'] },
  u: { w: 105, d: ['M10 100 V160 C10 212 90 212 90 160', 'M90 100 V200'] },
  v: { w: 100, d: ['M5 100 L50 200 L95 100'] },
  w: { w: 130, d: ['M5 100 L35 200 L65 105 L95 200 L125 100'] },
  x: { w: 100, d: ['M10 100 L90 200', 'M90 100 L10 200'] },
  y: { w: 100, d: ['M5 100 L50 200', 'M95 100 L35 300'] },
  z: { w: 105, d: ['M10 100 H90 L10 200 H95'] },
};
// Other ways children write the same letter, for the letter matcher only.
const PRINT_ALT = {
  a: [['M97 134 A48 48 0 1 0 97 166 C100 182 102 196 110 200']],
  e: [['M8 150 C40 152 75 150 98 146 C100 110 60 95 30 108 C0 125 2 185 40 198 C60 204 80 196 92 184']],
  k: [['M10 0 V200', 'M82 104 L14 152 L88 200']],
  t: [['M40 0 V180 C40 202 62 204 78 192', 'M8 90 H75']],
  y: [['M10 100 V150 C10 200 90 200 90 150', 'M90 100 V260 C90 302 25 302 10 272']],
  q: [['M97 134 A48 48 0 1 0 97 166', 'M100 100 V300']],
  u: [['M10 100 V170 C10 212 90 212 92 160 V100 V200']],
  j: [['M55 100 V265 C55 305 15 305 2 282']],
  i: [['M30 100 V200']],
  g: [['M97 134 A48 48 0 1 0 97 166', 'M100 100 V300']],
};
const CURSIVE = {
  a: ['M68 112 C55 92 20 98 12 135 C5 175 30 205 55 190 C68 182 72 150 74 102 C72 140 70 175 74 190 C77 202 92 200 100 194'],
  b: ['M5 165 C30 130 55 60 50 25 C47 0 22 5 20 40 C18 90 14 160 16 188 C18 205 50 205 56 160 C58 130 50 112 46 108 C55 118 70 112 85 106'],
  c: ['M72 112 C66 100 58 96 46 98 C24 102 12 120 12 145 C10 178 30 202 58 196 C70 193 80 190 92 188'],
  d: ['M68 112 C55 92 20 98 12 135 C5 175 30 205 55 190 C68 182 75 140 80 10 C80 60 76 160 78 188 C80 202 95 200 104 194'],
  e: ['M8 170 C40 160 60 130 50 112 C40 95 10 110 8 150 C6 190 30 205 55 195 C65 191 75 188 85 184'],

      if (b.state === 'ok') { wg.save(); wg.fillStyle = 'rgba(92,211,139,.10)'; wg.beginPath(); wg.roundRect(b.x, oy - 22 * s, b.w, 344 * s, 14); wg.fill(); wg.restore(); }
    }
    drawLines(layout.lines.x0, layout.lines.x1);
    for (const b of layout.boxes) {
      if (phase === 'trace' || b.state === 'ghost' || phase === 'look') drawGuide(b.glyph, { color: b.state === 'ok' ? '#5CD38B' : '#9B6BFF', solid: phase === 'look', noDots: phase === 'look' });
      if (phase === 'write' && b.state === 'ok' && b.shown) drawGuide(b.glyph, { color: '#5CD38B', solid: true, noDots: true, light: true });
    }
  } else {
    drawLines(layout.lines.x0, layout.lines.x1);
    if (phase !== 'demo' || demo) drawGuide(layout.guides, { light: cur.light, noDots: false });
  }
  wg.drawImage(winkCv, 0, 0, WCSS.w, WCSS.h);
  if (demo && demo.pts) {
    wg.save(); wg.lineCap = wg.lineJoin = 'round'; wg.strokeStyle = '#FF8C42'; wg.lineWidth = layout.brush * 0.55;
    for (const st of demo.pts) polyline(wg, st);
    const tip = demo.tip; if (tip) { wg.font = `${Math.round(layout.brush * 2)}px Segoe UI Emoji, sans-serif`; wg.textAlign = 'left'; wg.textBaseline = 'bottom'; wg.fillText('✏️', tip[0] - 4, tip[1] + 6); }
    wg.restore();
  }
}
function redrawInk() {
  wink.setTransform(dpr, 0, 0, dpr, 0, 0); wink.clearRect(0, 0, WCSS.w, WCSS.h);
  wink.lineCap = wink.lineJoin = 'round';
  for (const st of strokes) { wink.strokeStyle = st.color; wink.lineWidth = layout.brush; polyline(wink, st.pts); }
}
const INK = ['#FF4F8B', '#58C7F0', '#FF8C42', '#9B6BFF', '#2BB673'];

function loadWide(speak = true) {
  clearTimeout(gradeTimer); stopDemo(); busy = false; missed = false; strokes = []; drawing = null;
  $('win').classList.remove('on'); meter.style.width = '0';
  cur = makeItem(mode); sizeWide(); layout = buildLayout(); redrawInk();
  $('badge').textContent = 'Level ' + (P.lv[mode] + 1) + ': ' + LEVELS[mode][P.lv[mode]].name;
  $('meter').classList.toggle('hide', cur.kind === 'spell');
  if (cur.kind === 'spell') {
    wordEl.textContent = cur.emoji + '  ' + (cur.trace ? cur.word : '?');
    if (cur.trace) { phase = 'trace'; if (speak) say(`Spell ${cur.word}. ${cur.sentence} Trace each letter of ${cur.word}.`); }
    else { phase = 'look'; wordEl.textContent = cur.emoji + '  ' + cur.word; if (speak) say(`Spell ${cur.word}. ${cur.sentence} Look at it and remember it.`); busy = true; lookTimer = setTimeout(() => { busy = false; startWrite(speak); }, TRACE_HOOK.lookMs); }
  } else {
    wordEl.textContent = cur.single ? 'Cursive ' + cur.text : cur.text;
    phase = 'trace';
    if (speak) say(cur.single ? `Cursive ${cur.text}. Watch me, then trace it. Start at the green dot.` : `Write ${cur.text} in cursive. Keep your finger down to join the letters.`);
    if (P.lv.cursive <= 3 || cur.light) startDemo();
  }
  renderWide();
}
let lookTimer = null;
function startWrite(speak = true) {
  phase = 'write'; strokes = []; redrawInk();
  for (const b of layout.boxes) { b.state = 'empty'; b.tries = 0; b.shown = false; }
  wordEl.textContent = cur.emoji + '  ?';
  if (speak) say(`Now write ${cur.word} from memory. One letter in each box.`);
  renderWide();
}

// "Watch me": an orange pen draws the guide once.
function startDemo() {
  stopDemo();
  const all = layout.guides; const total = all.reduce((n, s) => n + s.length, 0); let shown = 0;
  demo = { pts: [], tip: null };
  const stepPerFrame = Math.max(2, Math.round(total / 90));
  const tick = () => {
    if (!demo) return;
    shown += stepPerFrame; let left = shown; demo.pts = [];
    for (const st of all) { if (left <= 0) break; const part = st.slice(0, Math.min(st.length, left)); left -= st.length; demo.pts.push(part); demo.tip = part[part.length - 1]; }
    renderWide();
    if (shown < total + 25) demo.raf = requestAnimationFrame(tick); else { demo = null; renderWide(); }
  };
  demo.raf = requestAnimationFrame(tick);
}
function stopDemo() { if (demo && demo.raf) cancelAnimationFrame(demo.raf); demo = null; }

function wpos(e) { const r = wc.getBoundingClientRect(); return [(e.clientX - r.left) * WCSS.w / r.width, (e.clientY - r.top) * WCSS.h / r.height]; }
let wActive = null;
wc.addEventListener('pointerdown', e => {
  if (wActive !== null || busy || !cur) return;
  if (phase === 'look') return;
  stopDemo(); clearTimeout(gradeTimer);
  wActive = e.pointerId; wc.setPointerCapture(e.pointerId);
  const p = wpos(e); drawing = { pts: [p], color: INK[strokes.length % INK.length], box: -1 };
  if (cur.kind === 'spell') {
    drawing.box = boxAt(p[0]);
    // Starting in another box: grade the box she was writing in.
    if (phase === 'write') for (const b of layout.boxes) if (b.state === 'inked' && layout.boxes.indexOf(b) !== drawing.box) gradeBox(layout.boxes.indexOf(b));
    const b = layout.boxes[drawing.box]; if (phase === 'write' && b && b.state === 'ok') { drawing = null; wActive = null; return; }
  }
  strokes.push(drawing); redrawInk(); renderWide();
});
wc.addEventListener('pointermove', e => {
  if (e.pointerId !== wActive || !drawing) return;
  const p = wpos(e), q = drawing.pts[drawing.pts.length - 1];
  if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 1.5) return;
  drawing.pts.push(p);
  wink.strokeStyle = drawing.color; wink.lineWidth = layout.brush; wink.lineCap = wink.lineJoin = 'round';
  wink.beginPath(); wink.moveTo(q[0], q[1]); wink.lineTo(p[0], p[1]); wink.stroke(); renderWide();
});
function wEnd(e) {
  if (e.pointerId !== wActive) return; wActive = null;
  const st = drawing; drawing = null; if (!st) return;
  if (cur.kind === 'spell') {
    if (phase === 'trace') checkTrace();
    else if (phase === 'write') { const b = layout.boxes[st.box]; if (b && (b.state === 'empty' || b.state === 'inked' || b.state === 'retry')) { b.state = 'inked'; gradeTimer = setTimeout(() => gradeBox(st.box), TRACE_HOOK.gradeMs); } else if (b && b.state === 'ghost') checkGhost(st.box); }
  } else checkCursive();
}
wc.addEventListener('pointerup', wEnd); wc.addEventListener('pointercancel', wEnd);
function boxAt(x) { let best = 0, bd = 1e9; layout.boxes.forEach((b, i) => { const d = x < b.x ? b.x - x : x > b.x + b.w ? x - b.x - b.w : 0; if (d < bd) { bd = d; best = i; } }); return best; }

// Coverage of guide strokes by her ink: each guide point counts if ink is on it or very close to it.
function guideCoverage(guides) {
  const d = wink.getImageData(0, 0, winkCv.width, winkCv.height).data, W = winkCv.width, H = winkCv.height, b = layout.brush * 0.42 * dpr;
  const at = (x, y) => { x = Math.round(x); y = Math.round(y); return x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 40; };
  let hit = 0, n = 0;
  for (const st of guides) for (let i = 0; i < st.length; i += 2) { const x = st[i][0] * dpr, y = st[i][1] * dpr; n++; if (at(x, y) || at(x + b, y) || at(x - b, y) || at(x, y + b) || at(x, y - b)) hit++; }
  return n ? hit / n : 0;
}
// Share of her ink that is far from every guide (a scribble is not a trace).
function offGuide(guides, list) {
  const r = layout.brush * 1.5; let far = 0, n = 0; const pts = []; for (const st of guides) for (let i = 0; i < st.length; i += 2) pts.push(st[i]);
  for (const st of list) for (let i = 0; i < st.pts.length; i += 2) { const [x, y] = st.pts[i]; n++; let near = false; for (const q of pts) if (Math.abs(q[0] - x) < r && Math.abs(q[1] - y) < r && Math.hypot(q[0] - x, q[1] - y) < r) { near = true; break; } if (!near) far++; }
  return n ? far / n : 0;
}
let nudgedW = false;
function checkTrace() {
  layout.boxes.forEach((b, i) => {
    if (b.state === 'ok') return;
    const mine = strokes.filter(s => s.box === i);
    if (!mine.length) return;
    if (guideCoverage(b.glyph) >= 0.8 && offGuide(b.glyph, mine) <= 0.35) { b.state = 'ok'; say(b.ch); }
  });
  renderWide();
  if (layout.boxes.every(b => b.state === 'ok')) { busy = true; setTimeout(() => { busy = false; startWrite(); }, 1100); }
}
function checkCursive() {
  const c = guideCoverage(layout.guides), off = offGuide(layout.guides, strokes);
  const need = cur.single ? 0.86 : 0.82;
  meter.style.width = Math.round(Math.min(1, c / need) * 100) + '%';
  if (c >= need && off <= 0.3) return winWide();
  if (c >= need && !nudgedW) { nudgedW = true; missed = true; say('Try to stay on the line. Tap the drop to start over.'); }
}
function boxStrokesInUnits(i) {
  const { s, ox, oy } = layout, b = layout.boxes[i];
  return strokes.filter(st => st.box === i).map(st => st.pts.map(([x, y]) => [(x - ox) / s - b.lx, (y - oy) / s]));
}
function gradeBox(i) {
  clearTimeout(gradeTimer);
  const b = layout.boxes[i]; if (!b || b.state !== 'inked') return;
  const res = recognize(boxStrokesInUnits(i), b.ch); b.last = res;
  if (res.ok) { b.state = 'ok'; renderWide(); say(b.ch); if (layout.boxes.every(x => x.state === 'ok')) winWide(); return; }
  missed = true; b.tries++;
  strokes = strokes.filter(st => st.box !== i); redrawInk();
  if (b.tries >= 2) { b.state = 'ghost'; say(`This one is ${b.ch}. Trace it.`); }
  else { b.state = 'retry'; b.flash = true; say(`Hmm, try that letter again. ${cur.word}.`); }
  renderWide();
}
function checkGhost(i) {
  const b = layout.boxes[i]; const mine = strokes.filter(s => s.box === i);
  if (guideCoverage(b.glyph) >= 0.75 && offGuide(b.glyph, mine) <= 0.4) { b.state = 'ok'; b.shown = true; renderWide(); say(b.ch); if (layout.boxes.every(x => x.state === 'ok')) winWide(); }
}
function winWide() {
  busy = true; clearTimeout(gradeTimer);
  const right = !missed, ch = record(mode, right);
  P.stars++; if (mode === 'spell') P.words++; else P.cursive++; persist(); showStars();
  const spelled = cur.kind === 'spell' ? cur.word.split('').join(', ') + '. ' + cur.word + '!' : '';
  $('winText').textContent = cur.kind === 'spell' ? cur.word : (cur.single ? 'Cursive ' + cur.text : cur.text);
  $('winEmoji').textContent = cur.kind === 'spell' ? (cur.emoji || '⭐') : '✍️';
  $('win').classList.add('on'); sparkle();
  say(cur.kind === 'spell' ? 'You spelled it! ' + spelled : 'Beautiful cursive!');
  let wait = 3000;
  if (ch > 0) { setTimeout(() => { $('winText').textContent = 'Level up!'; $('winEmoji').textContent = LEVELS[mode][P.lv[mode]].name; say('Level up! ' + LEVELS[mode][P.lv[mode]].name + '!'); }, 2600); wait = 5000; }
  else if (ch < 0) setTimeout(() => say('Let us practise some easier ones.'), 2600);
  winTimer = setTimeout(() => { if (mode !== 'little') { nudgedW = false; loadWide(); } }, wait);
}
let winTimer = null;
function clearWide() {
  if (busy || !cur) return;
  clearTimeout(gradeTimer);
  if (strokes.length) missed = missed || cur.kind === 'cursive';
  if (cur.kind === 'spell') {
    const keep = new Set(layout.boxes.map((b, i) => b.state === 'ok' ? i : -1));
    strokes = strokes.filter(st => keep.has(st.box));
    for (const b of layout.boxes) if (b.state === 'inked' || b.state === 'retry') b.state = 'empty';
  } else { strokes = []; meter.style.width = '0'; nudgedW = false; }
  redrawInk(); renderWide();
}

// ===========================================================================
// Modes and buttons
// ===========================================================================
function showStars() { $('stars').textContent = mode === 'little' ? '' : '⭐ ' + P.stars; }
function setMode(m) {
  clearTimeout(winTimer); clearTimeout(lookTimer); clearTimeout(gradeTimer); stopDemo();
  mode = m; busy = false;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  const little = m === 'little';
  $('decks').classList.toggle('hide', !little); $('badge').classList.toggle('hide', little);
  $('stage').classList.toggle('hide', !little); $('wide').classList.toggle('hide', little);
  $('prev').classList.toggle('hide', !little); $('meter').classList.remove('hide');
  showStars();
  if (little) { requestAnimationFrame(() => { fit(); loadLittle(idx); }); }
  else requestAnimationFrame(() => loadWide());
  try { localStorage.setItem('trace-mode', m); } catch (e) {}
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('prev').onclick = () => { if (mode === 'little') loadLittle(idx - 1); };
$('next').onclick = () => { if (mode === 'little') loadLittle(idx + 1); else { clearTimeout(winTimer); clearTimeout(lookTimer); loadWide(); } };
$('clear').onclick = () => { if (mode === 'little') loadLittle(idx, false); else clearWide(); };
$('hear').onclick = () => {
  if (mode === 'little') return say(item().say);
  if (cur.kind === 'spell') say(`${cur.word}. ${cur.sentence} ${cur.word}.`); else say(cur.single ? 'Cursive ' + cur.text : cur.text);
};
document.querySelectorAll('.deck[data-deck]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.deck[data-deck]').forEach(x => x.classList.toggle('on', x === b));
  deck = b.dataset.deck; loadLittle(0);
});
$('board-btn').onclick = () => {
  const got = new Set(loadStickers()), grid = $('stickers'); grid.innerHTML = '';
  for (const d of Object.values(DECKS)) for (const it of d) {
    const cell = document.createElement('div'); cell.dataset.l = it.label; cell.textContent = got.has(it.id) ? (it.emoji.length > 4 ? it.emoji.slice(0, 2) : it.emoji) : '';
    if (got.has(it.id)) cell.classList.add('got'); grid.appendChild(cell);
  }
  $('boardNote').textContent = `⭐ ${P.stars}: ${P.words} words spelled, ${P.cursive} cursive.`;
  $('board').classList.add('on');
  say(`You have ${got.size} stickers!`);
};
$('board-close').onclick = () => $('board').classList.remove('on');

function fit() { const m = document.querySelector('main'), s = Math.min(m.clientWidth, m.clientHeight) - 24; cv.style.width = cv.style.height = s + 'px'; }
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (mode === 'little') fit(); else if (cur && !busy) { sizeWide(); layout = buildLayout(); strokes = []; if (phase === 'write') for (const b of layout.boxes) b.state = 'empty'; redrawInk(); renderWide(); } }, 200); });
const TRACE_HOOK = { lookMs: 3500, gradeMs: 1500 };
let startMode = 'spell'; try { startMode = localStorage.getItem('trace-mode') || 'spell'; } catch (e) {}
if (!['little', 'spell', 'cursive'].includes(startMode)) startMode = 'spell';
setMode(startMode);
addEventListener('pointerdown', () => { if (mode === 'little') say('Trace With Me! ' + item().say); else $('hear').click(); }, { once: true });

// Test hook.
window.TRACE = {
  PRINT, PRINT_ALT, CURSIVE, SPELL, CURSIVE_LEVELS, START, SLANT, opts: TRACE_HOOK,
  samplePath, cursiveWord, slant, printLetter, recognize, features, record, makeItem,
  P: () => P, current: () => cur, phase: () => phase, layout: () => layout, mode: () => mode, setMode,
  load: () => loadWide(false), startWrite: () => startWrite(false),
  // Guide strokes in page (client) coordinates, for driving the mouse in tests.
  clientGuides: () => { const r = wc.getBoundingClientRect(), k = r.width / WCSS.w; const map = st => st.map(([x, y]) => [r.left + x * k, r.top + y * k]); return cur.kind === 'spell' ? layout.boxes.map(b => b.glyph.map(map)) : [layout.guides.map(map)]; },
  boxes: () => layout.boxes.map(b => ({ ch: b.ch, state: b.state, last: b.last && b.last.ranking })),
  toClient: (i, unitStrokes) => { const r = wc.getBoundingClientRect(), k = r.width / WCSS.w, b = layout.boxes[i]; return unitStrokes.map(st => st.map(([x, y]) => [r.left + (layout.ox + (x + b.lx) * layout.s) * k, r.top + (layout.oy + y * layout.s) * k])); },
};
</script>
