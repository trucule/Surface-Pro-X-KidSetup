<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up</title>
<!--
  Level Up. One offline file, no API. Six subjects, each a ladder of levels from kindergarten to about 4th grade:
  Reading, Math, Color Lab, Patterns, Time & Money, Shapes & Fractions. Questions are generated, so they do not
  repeat in a fixed order.

  Each subject keeps its own level. Four right in a row moves her up a level; two misses in the last four at a level
  moves her down one, so she stays where it is a little hard. A subject she has not played starts near 2nd grade
  and climbs fast at first (two in a row moves up during the first eight questions), so it finds her level quickly.
  Daily Quest mixes ten questions from every subject. Progress is in localStorage under levelup-v1.
-->
<style>
  :root { --ink: #2B2140; --paper: #FFF9F0; --pink: #FF4F8B; --sun: #FFC93C; --sky: #58C7F0; --leaf: #5CD38B; --grape: #9B6BFF; --coral: #FF8A5B; --line: #d9cfe8; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; color: var(--ink); }
  .screen { position: fixed; inset: 0; display: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.on { display: flex; flex-direction: column; }

  /* Home */
  #home header { display: flex; align-items: center; gap: 14px; padding: 16px 210px 6px 24px; } /* right side: room for the tablet's Home pill */
  #home h1 { margin: 0 auto 0 0; font-size: 38px; font-weight: 900; letter-spacing: .5px; }
  #home h1 span { color: var(--pink); }
  #totalStars { font-size: 26px; font-weight: 900; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; }
  #grid { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 24px 120px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
  .card { position: relative; border: 4px solid var(--ink); border-radius: 26px; background: #fff; padding: 16px 18px 18px; text-align: left; cursor: pointer; box-shadow: 0 8px 0 var(--ink); min-height: 150px; }
  .card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--ink); }
  .card .icon { font-size: 46px; line-height: 1; }
  .card .name { font-size: 26px; font-weight: 900; margin-top: 6px; }
  .card .lvl { font-size: 17px; font-weight: 700; opacity: .8; margin-top: 2px; }
  .card .bar { height: 14px; border-radius: 999px; background: #eee6f5; margin-top: 12px; overflow: hidden; border: 2px solid var(--ink); }
  .card .bar i { display: block; height: 100%; background: var(--leaf); }
  .card .badge { position: absolute; right: 14px; top: 14px; font-size: 18px; font-weight: 900; border: 3px solid var(--ink); border-radius: 999px; padding: 2px 12px; background: var(--sun); }
  .card.quest { grid-column: 1 / -1; background: linear-gradient(120deg, #FFE7F0, #E8F7FF); min-height: 120px; display: flex; align-items: center; gap: 18px; }
  .card.quest .icon { font-size: 64px; }
  .card.quest .name { font-size: 32px; margin: 0; }

  /* Play */
  #play header { display: flex; align-items: center; gap: 12px; padding: 12px 210px 12px 18px; } /* right side: room for the tablet's Home pill */
  #play .back { border: 4px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 18px; font-size: 22px; font-weight: 900; cursor: pointer; }
  #subj { font-size: 24px; font-weight: 900; margin-right: auto; }
  #lvlBadge { font-size: 18px; font-weight: 900; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px; background: var(--sun); }
  #streak { font-size: 22px; font-weight: 900; min-width: 90px; text-align: right; }
  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 4px 20px 10px; overflow-y: auto; }
  #prompt { font-size: 32px; font-weight: 800; text-align: center; max-width: 1000px; line-height: 1.25; }
  #passage { display: none; font-size: 25px; line-height: 1.5; max-width: 900px; background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 14px 22px; }
  #passage.on { display: block; }
  #visual { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 64px; min-height: 10px; max-width: 1100px; }
  #visual svg { display: block; }
  .swatch { width: 96px; height: 96px; border-radius: 22px; border: 4px solid var(--ink); display: inline-block; }
  .op { font-size: 54px; font-weight: 900; }
  #answers { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 1100px; }
  #answers button { border: 4px solid var(--ink); background: #fff; border-radius: 22px; min-width: 120px; min-height: 96px; padding: 10px 22px; font-size: 32px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 0 var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
  #answers button:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink); }
  #answers button.word { font-size: 30px; }
  #answers button.right { background: #CFF5DC; }
  #answers button.wrong { background: #ffd6d6; animation: shake .4s; }
  #answers button .swatch { width: 70px; height: 70px; border-width: 3px; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #entry { display: none; flex-direction: column; align-items: center; gap: 12px; }
  #entry.on { display: flex; }
  #typed { min-width: 220px; min-height: 76px; border: 4px solid var(--ink); border-radius: 20px; background: #fff; font-size: 52px; font-weight: 900; text-align: center; padding: 0 18px; line-height: 76px; }
  #pad { display: grid; grid-template-columns: repeat(6, 82px); gap: 10px; }
  #pad button { height: 74px; border: 4px solid var(--ink); border-radius: 18px; background: #fff; font-size: 34px; font-weight: 900; cursor: pointer; }
  #pad button.go { background: var(--leaf); }
  #pad button.del { background: #ffe4cc; }
  #mixer { display: none; flex-direction: column; align-items: center; gap: 14px; }
  #mixer.on { display: flex; }
  #mixer .row { display: flex; align-items: center; gap: 22px; }
  #mixer .label { font-size: 22px; font-weight: 800; text-align: center; }
  #bowl { width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--ink); background: #fff; }
  #drops { display: flex; gap: 12px; }
  #drops button { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--ink); cursor: pointer; font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  #mixer .tools { display: flex; gap: 14px; }
  #mixer .tools button { border: 4px solid var(--ink); border-radius: 999px; background: #fff; padding: 10px 22px; font-size: 24px; font-weight: 900; cursor: pointer; }
  #mixer .tools button.go { background: var(--leaf); }
  #feedback { display: none; position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: min(900px, 92vw); background: #fff; border: 4px solid var(--ink); border-radius: 26px; padding: 16px 22px; font-size: 24px; font-weight: 700; z-index: 5; box-shadow: 0 10px 0 var(--pink); align-items: center; gap: 18px; }
  #feedback.on { display: flex; }
  #feedback.good { box-shadow: 0 10px 0 var(--leaf); }
  #feedback .msg { flex: 1; line-height: 1.35; }
  #feedback button { border: 4px solid var(--ink); border-radius: 999px; background: var(--sun); padding: 10px 26px; font-size: 26px; font-weight: 900; cursor: pointer; white-space: nowrap; }
  footer { display: flex; justify-content: center; gap: 14px; padding: 6px 14px 14px; }
  footer button { border: 4px solid var(--ink); background: #fff; border-radius: 50%; width: 72px; height: 72px; font-size: 32px; cursor: pointer; }
  #pop { position: fixed; inset: 0; display: none; place-items: center; z-index: 8; background: rgba(43,33,64,.35); }
  #pop.on { display: grid; }
  #pop .box { background: #fff; border: 5px solid var(--ink); border-radius: 30px; padding: 26px 38px; text-align: center; box-shadow: 0 12px 0 var(--pink); animation: pop .45s cubic-bezier(.2,1.6,.4,1); max-width: 80vw; }
  #pop .big { font-size: 70px; }
  #pop .title { font-size: 36px; font-weight: 900; margin: 6px 0; }
  #pop .sub { font-size: 22px; font-weight: 700; opacity: .85; }
  #pop button { margin-top: 16px; border: 4px solid var(--ink); border-radius: 999px; background: var(--sun); padding: 10px 30px; font-size: 26px; font-weight: 900; cursor: pointer; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .spark { position: fixed; font-size: 40px; pointer-events: none; z-index: 9; transition: transform 1s ease-out, opacity 1s; }
  @media (max-width: 700px) { #prompt { font-size: 26px; } #pad { grid-template-columns: repeat(4, 74px); } #answers button { min-width: 96px; font-size: 26px; } }
</style>
</head>
<body>
<section id="home" class="screen on">
  <header>
    <h1>Level <span>Up</span></h1>
    <div id="totalStars">⭐ 0</div>
  </header>
  <div id="grid"></div>
</section>

<section id="play" class="screen">
  <header>
    <button class="back" id="back">◀ Menu</button>
    <div id="subj"></div>
    <div id="lvlBadge"></div>
    <div id="streak"></div>
  </header>
  <div id="stage">
    <div id="prompt"></div>
    <div id="passage"></div>
    <div id="visual"></div>
    <div id="answers"></div>
    <div id="entry"><div id="typed"></div><div id="pad"></div></div>
    <div id="mixer">
      <div class="row">
        <div><div class="label">Make this</div><div class="swatch" id="target" style="width:150px;height:150px;border-radius:50%"></div></div>
        <div><div class="label">Your bowl</div><div id="bowl"></div></div>
      </div>
      <div id="drops"></div>
      <div class="tools"><button id="mixUndo">↩ Undo</button><button id="mixClear">Empty</button><button class="go" id="mixCheck">✔ Check</button></div>
    </div>
  </div>
  <footer>
    <button id="hear" title="Hear it">🔈</button>
    <button id="skip" title="New question">🔁</button>
  </footer>
  <div id="feedback"><div class="msg" id="fbMsg"></div><button id="fbNext">Next ▶</button></div>
</section>

<div id="pop"><div class="box"><div class="big" id="popBig"></div><div class="title" id="popTitle"></div><div class="sub" id="popSub"></div><button id="popOk">OK</button></div></div>

<script id="voicepack">/* voice pack goes here: run voices/make-voices.py */</script>
<script>
// ---------------------------------------------------------------------------
// Voice: a clip from the voice pack when there is one for the phrase, otherwise the Windows voice.
// ---------------------------------------------------------------------------
const VOICE = (() => {
  let actx = null, cur = null; const decoded = new Map();
  const key = t => String(t).trim().toLowerCase().replace(/\s+/g, ' ');
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  function stop() { if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } }
  function play(t) {
    const p = window.VOICE_PACK, k = key(t); if (!p || !p[k]) return false;
    const a = ctx(); if (!a) return false;
    const go = buf => { stop(); const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination); s.onended = () => { if (cur === s) cur = null; }; cur = s; s.start(); };
    try {
      if (decoded.has(k)) { go(decoded.get(k)); return true; }
      const bin = atob(p[k]), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      a.decodeAudioData(bytes.buffer.slice(0)).then(buf => { decoded.set(k, buf); go(buf); }).catch(() => {});
      return true;
    } catch (e) { return false; }
  }
  return { play, stop };
})();
function say(t) { if (!t) return; try { speechSynthesis.cancel(); } catch (e) {} VOICE.stop(); if (VOICE.play(t)) return; try { const u = new SpeechSynthesisUtterance(t); u.rate = 0.92; u.pitch = 1.05; speechSynthesis.speak(u); } catch (e) {} }

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NUMWORD = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

// Question shapes:
//   { prompt, speak?, passage?, visual? (HTML), type: 'choice', choices: [{ label | html, speak? }], answer: index, explain }
//   { prompt, speak?, visual?, type: 'number', answer: integer, explain }
//   { prompt, speak?, type: 'mix', paints: [...], target: { counts }, explain }
// A choice question's answer is the index of the right choice after shuffling (choice() builds it).
function choice(prompt, right, wrongs, extra = {}) {
  const all = shuffle([{ ...asChoice(right), ok: true }, ...wrongs.map(w => ({ ...asChoice(w), ok: false }))]);
  return { prompt, type: 'choice', choices: all, answer: all.findIndex(c => c.ok), ...extra };
}
function asChoice(x) { return typeof x === 'object' ? x : { label: String(x) }; }
// Distinct, plausible, non-negative distractors near the answer.
function nearby(ans, n = 3, spread = 3, min = 0) {
  const out = new Set(); let guard = 0;
  while (out.size < n && guard++ < 200) { const d = ans + (Math.random() < .5 ? -1 : 1) * rnd(1, spread); if (d !== ans && d >= min) out.add(d); }
  let k = 1; while (out.size < n) { if (ans + k !== ans) out.add(ans + k); k++; }
  return [...out];
}
function emojiRow(e, n) { return Array.from({ length: n }, () => e).join(''); }

// ---------------------------------------------------------------------------
// MATH
// ---------------------------------------------------------------------------
const OBJ = ['🍎', '🐠', '⭐', '🧁', '🎈', '🐞', '🍓', '🚗', '🌻', '🥕'];
const OBJN = { '🍎': 'apples', '🐠': 'fish', '⭐': 'stars', '🧁': 'cupcakes', '🎈': 'balloons', '🐞': 'ladybugs', '🍓': 'strawberries', '🚗': 'cars', '🌻': 'sunflowers', '🥕': 'carrots' };
const NAMES = ['Maya', 'Leo', 'Ava', 'Sam', 'Nora', 'Eli', 'Zoe', 'Max', 'Ruby', 'Finn'];
const math = [
  { name: 'Add within 10', grade: 'K', gen() {
      const a = rnd(1, 6), b = rnd(1, 10 - a), e = pick(OBJ);
      return choice(`${a} + ${b} = ?`, a + b, nearby(a + b, 2, 2, 1), { visual: `<span>${emojiRow(e, a)}</span><span class="op">+</span><span>${emojiRow(e, b)}</span>`, speak: `${a} plus ${b}`, explain: `Count them all: ${a} and ${b} more makes ${a + b}.` });
  } },
  { name: 'Add and subtract within 20', grade: '1', gen() {
      if (Math.random() < .5) { const a = rnd(3, 12), b = rnd(2, 20 - a); return { prompt: `${a} + ${b} = ?`, speak: `${a} plus ${b}`, type: 'number', answer: a + b, explain: `${a} + ${b} = ${a + b}. Start at ${a} and count up ${b}.` }; }
      const a = rnd(8, 20), b = rnd(2, a - 1); return { prompt: `${a} − ${b} = ?`, speak: `${a} minus ${b}`, type: 'number', answer: a - b, explain: `${a} − ${b} = ${a - b}. Start at ${a} and count back ${b}.` };
  } },
  { name: 'Two-digit adding', grade: '2', gen() {
      const t1 = rnd(1, 6), t2 = rnd(1, 8 - t1), o1 = rnd(0, 8), o2 = rnd(0, 9 - o1), a = t1 * 10 + o1, b = t2 * 10 + o2;
      if (Math.random() < .5) return { prompt: `${a} + ${b} = ?`, speak: `${a} plus ${b}`, type: 'number', answer: a + b, explain: `Add the tens: ${t1 * 10} + ${t2 * 10} = ${(t1 + t2) * 10}. Add the ones: ${o1} + ${o2} = ${o1 + o2}. Together ${a + b}.` };
      const big = a + b; return { prompt: `${big} − ${b} = ?`, speak: `${big} minus ${b}`, type: 'number', answer: a, explain: `Take away the tens, then the ones: ${big} − ${b} = ${a}.` };
  } },
  { name: 'Regrouping', grade: '2', gen() {
      if (Math.random() < .5) { let a, b; do { a = rnd(15, 68); b = rnd(15, 89 - a); } while ((a % 10) + (b % 10) < 10); return { prompt: `${a} + ${b} = ?`, speak: `${a} plus ${b}`, type: 'number', answer: a + b, explain: `The ones make ${(a % 10) + (b % 10)}, that is a new ten. ${a} + ${b} = ${a + b}.` }; }
      let a, b; do { a = rnd(31, 95); b = rnd(12, a - 10); } while ((a % 10) >= (b % 10)); return { prompt: `${a} − ${b} = ?`, speak: `${a} minus ${b}`, type: 'number', answer: a - b, explain: `There are not enough ones, so trade a ten for ten ones. ${a} − ${b} = ${a - b}.` };
  } },
  { name: 'Place value', grade: '2', gen() {
      const n = rnd(102, 987), d = String(n), r = Math.random();
      if (r < .45) { const i = rnd(0, 2), digit = +d[i]; if (digit === 0) return math[4].gen(); const place = [100, 10, 1][i], val = digit * place;
        const wr = [digit * 100, digit * 10, digit].filter(v => v !== val);
        return choice(`What is the ${digit} in ${n} worth?`, val, wr, { speak: `In ${n}, what is the ${digit} worth?`, visual: `<span style="font-size:80px;font-weight:900">${d.split('').map((c, j) => j === i ? `<u style="color:var(--pink)">${c}</u>` : c).join('')}</span>`, explain: `The ${digit} is in the ${['hundreds', 'tens', 'ones'][i]} place, so it is worth ${val}.` }); }
      if (r < .75) { const h = +d[0], t = +d[1], o = +d[2]; return { prompt: `${h} hundreds, ${t} tens, ${o} ones = ?`, speak: `${h} hundreds, ${t} tens and ${o} ones make what number?`, type: 'number', answer: n, explain: `${h * 100} + ${t * 10} + ${o} = ${n}.` }; }
      const m = n + pick([-90, -9, 9, 90, 100, -100].filter(x => n + x > 99 && n + x < 1000)); const big = Math.max(n, m);
      return choice(`Which number is bigger?`, big, [Math.min(n, m)], { explain: `Look at the hundreds first, then the tens, then the ones. ${big} is bigger.` });
  } },
  { name: 'Three-digit math', grade: '3', gen() {
      if (Math.random() < .5) { const a = rnd(120, 650), b = rnd(105, 999 - a); return { prompt: `${a} + ${b} = ?`, speak: `${a} plus ${b}`, type: 'number', answer: a + b, explain: `Add hundreds, tens, then ones, and carry when a place gets to ten. ${a} + ${b} = ${a + b}.` }; }
      const a = rnd(300, 999), b = rnd(110, a - 50); return { prompt: `${a} − ${b} = ?`, speak: `${a} minus ${b}`, type: 'number', answer: a - b, explain: `Subtract ones, tens, then hundreds, trading when you need more. ${a} − ${b} = ${a - b}.` };
  } },
  { name: 'Times tables: 2, 5, 10', grade: '2', gen() {
      const a = pick([2, 5, 10]), b = rnd(1, 10), e = pick(OBJ);
      const vis = b <= 6 && a <= 5 ? Array.from({ length: b }, () => `<span style="font-size:38px;display:inline-block;margin:0 10px">${emojiRow(e, a)}</span>`).join('') : '';
      return choice(`${b} × ${a} = ?`, a * b, nearby(a * b, 3, a, 0), { visual: vis, speak: `${b} groups of ${a}. ${b} times ${a}`, explain: `${b} groups of ${a}: count by ${a}s ${b} times to get ${a * b}.` });
  } },
  { name: 'Times tables to 10', grade: '3', gen() {
      const a = rnd(2, 10), b = rnd(2, 10);
      if (Math.random() < .3) return { prompt: `${a * b} ÷ ${a} = ?`, speak: `${a * b} divided by ${a}`, type: 'number', answer: b, explain: `${a} × ${b} = ${a * b}, so ${a * b} ÷ ${a} = ${b}.` };
      return { prompt: `${a} × ${b} = ?`, speak: `${a} times ${b}`, type: 'number', answer: a * b, explain: `${a} × ${b} = ${a * b}. Tip: ${b} × ${a} is the same.` };
  } },
  { name: 'Word problems', grade: '3', gen() {
      const n = pick(NAMES), e = pick(OBJ), things = OBJN[e], t = rnd(0, 3);
      if (t === 0) { const a = rnd(12, 40), b = rnd(5, 20), c = rnd(3, Math.min(15, a + b - 1)); return { prompt: `${n} has ${a} ${things}. ${n} gets ${b} more, then gives away ${c}. How many now?`, type: 'number', answer: a + b - c, visual: e, explain: `${a} + ${b} = ${a + b}, then ${a + b} − ${c} = ${a + b - c}.` }; }
      if (t === 1) { const bags = rnd(3, 8), per = rnd(3, 9); return { prompt: `There are ${bags} bags with ${per} ${things} in each bag. How many ${things} in all?`, type: 'number', answer: bags * per, visual: e, explain: `${bags} groups of ${per}: ${bags} × ${per} = ${bags * per}.` }; }
      if (t === 2) { const kids = rnd(2, 6), each = rnd(2, 8); return { prompt: `${kids * each} ${things} are shared equally by ${kids} friends. How many does each friend get?`, type: 'number', answer: each, visual: e, explain: `${kids * each} ÷ ${kids} = ${each}, because ${kids} × ${each} = ${kids * each}.` }; }
      const a = rnd(25, 80), b = rnd(10, a - 5); return { prompt: `${n} read ${a} pages. Her friend read ${b} pages. How many more pages did ${n} read?`, type: 'number', answer: a - b, visual: '📚', explain: `"How many more" means subtract: ${a} − ${b} = ${a - b}.` };
  } },
  { name: 'Bigger multiplying', grade: '4', gen() {
      if (Math.random() < .6) { const a = rnd(12, 49), b = rnd(2, 9); return { prompt: `${a} × ${b} = ?`, speak: `${a} times ${b}`, type: 'number', answer: a * b, explain: `Split it: ${Math.floor(a / 10) * 10} × ${b} = ${Math.floor(a / 10) * 10 * b}, and ${a % 10} × ${b} = ${(a % 10) * b}. Add them: ${a * b}.` }; }

  { id: 'color', name: 'Color Lab', icon: '🎨', color: '#FFF4D6', levels: color, start: 2 },
  { id: 'patterns', name: 'Patterns', icon: '🔁', color: '#EAFBEF', levels: patterns, start: 3 },
  { id: 'time', name: 'Time & Money', icon: '⏰', color: '#F1EAFF', levels: time, start: 3 },
  { id: 'shapes', name: 'Shapes & Fractions', icon: '🔺', color: '#FFEDE4', levels: shapes, start: 2 },

const UP_STREAK = 4, WARMUP = 8;

// ---------------------------------------------------------------------------
// Progress
// ---------------------------------------------------------------------------
const STORE = 'levelup-v1';
let prog = {};
try { prog = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { prog = {}; }
function P(id) { const s = SUBJECTS.find(x => x.id === id); if (!prog[id]) prog[id] = { level: s.start, streak: 0, recent: [], played: 0, stars: 0, best: s.start }; return prog[id]; }
function save() { try { localStorage.setItem(STORE, JSON.stringify(prog)); } catch (e) {} }
function totalStars() { return SUBJECTS.reduce((s, x) => s + (prog[x.id] ? prog[x.id].stars : 0), 0); }

// Returns 'up', 'down' or null after recording one answer.
function record(id, ok) {
  const p = P(id), s = SUBJECTS.find(x => x.id === id), max = s.levels.length - 1;
  p.played++; if (ok) { p.stars++; p.streak++; } else p.streak = 0;
  p.recent.push(ok ? 1 : 0); if (p.recent.length > 4) p.recent.shift();
  let move = null;
  const need = p.played <= WARMUP ? 2 : UP_STREAK;
  if (ok && p.streak >= need && p.level < max) { p.level++; p.streak = 0; p.recent = []; move = 'up'; }
  else if (!ok && p.recent.length >= 2 && p.recent.filter(x => !x).length >= 2 && p.level > 0) { p.level--; p.streak = 0; p.recent = []; move = 'down'; }
  p.best = Math.max(p.best, p.level);
  save(); return move;
}

  const g = $('grid'); g.innerHTML = '';
  const q = document.createElement('button'); q.className = 'card quest';
  q.innerHTML = `<div class="icon">🗺️</div><div><div class="name">Daily Quest</div><div class="lvl">Ten questions from every subject</div></div>`;
  q.onclick = () => startQuest(); g.appendChild(q);
  for (const s of SUBJECTS) {
    const p = P(s.id), lv = s.levels[p.level], pct = Math.round(100 * Math.min(p.streak, UP_STREAK) / UP_STREAK);
    const b = document.createElement('button'); b.className = 'card'; b.style.background = s.color;
    b.innerHTML = `<span class="badge">Level ${p.level + 1}</span><div class="icon">${s.icon}</div><div class="name">${s.name}</div><div class="lvl">${esc(lv.name)} · ${gradeLabel(lv.grade)}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
    b.onclick = () => startSubject(s.id); g.appendChild(b);
  }
  $('totalStars').textContent = '⭐ ' + totalStars();
  show('home');
}

let mode = null, cur = null, curSubj = null, questLeft = 0, questRight = 0, questSeq = [], locked = false, typed = '', mixCounts = {}, mixHistory = [];
function startSubject(id) { mode = 'subject'; curSubj = id; next(); show('play'); }
function startQuest() { mode = 'quest'; questLeft = 10; questRight = 0; questSeq = shuffle([...SUBJECTS.map(s => s.id), ...sample(SUBJECTS.map(s => s.id), 4)]); next(); show('play'); }

function next() {
  hideFeedback();
  if (mode === 'quest') { if (questLeft <= 0) return endQuest(); curSubj = questSeq[10 - questLeft]; }
  const s = SUBJECTS.find(x => x.id === curSubj), p = P(curSubj), lv = s.levels[p.level];
  let q = null, tries = 0; while (!q && tries++ < 5) { try { q = lv.gen(); } catch (e) { q = null; } }
  cur = q; locked = false;
  $('subj').textContent = (mode === 'quest' ? `🗺️ ${11 - questLeft}/10 · ` : '') + s.icon + ' ' + s.name;
  $('lvlBadge').textContent = `Level ${p.level + 1}: ${lv.name}`;
  $('streak').textContent = p.streak ? '🔥 ' + p.streak : '';
  renderQuestion(q);
}

function renderQuestion(q) {
  $('prompt').textContent = q.prompt;
  const pass = $('passage'); pass.classList.toggle('on', !!q.passage); pass.innerHTML = q.passage || '';
  $('visual').innerHTML = q.visual || '';
  const ans = $('answers'); ans.innerHTML = '';
  $('entry').classList.toggle('on', q.type === 'number');
  $('mixer').classList.toggle('on', q.type === 'mix');
  if (q.type === 'choice') q.choices.forEach((c, i) => {
    const b = document.createElement('button'); if (c.cls) b.className = c.cls;
    if (c.html) b.innerHTML = c.html; else b.textContent = c.label;
    b.onclick = () => answer(i === q.answer, b); ans.appendChild(b);
  });
  if (q.type === 'number') { typed = ''; $('typed').textContent = ''; }
  if (q.type === 'mix') setupMix(q);
  speakQuestion();
}
// Reads the passage (if any) and then the question.
function speakQuestion() { if (!cur) return; const passage = cur.passage ? cur.passage.replace(/<[^>]+>/g, '') + ' ' : ''; say(passage + (cur.speak || cur.prompt)); }

function buildPad() {
  const pad = $('pad'); pad.innerHTML = '';
  for (const k of ['1', '2', '3', '4', '5', '⌫', '6', '7', '8', '9', '0', '✔']) {
    const b = document.createElement('button'); b.textContent = k; if (k === '✔') b.className = 'go'; if (k === '⌫') b.className = 'del';
    b.onclick = () => {
      if (locked) return;
      if (k === '⌫') typed = typed.slice(0, -1);
      else if (k === '✔') { if (typed) answer(+typed === cur.answer, null); return; }
      else if (typed.length < 5) typed = (typed === '0' ? '' : typed) + k;
      $('typed').textContent = typed;
    };
    pad.appendChild(b);
  }
}
addEventListener('keydown', e => { if (!cur || cur.type !== 'number' || locked) return; if (/^[0-9]$/.test(e.key) && typed.length < 5) typed += e.key; else if (e.key === 'Backspace') typed = typed.slice(0, -1); else if (e.key === 'Enter' && typed) return answer(+typed === cur.answer, null); $('typed').textContent = typed; });

function setupMix(q) {
  mixCounts = {}; mixHistory = [];
  $('target').style.background = css(mixPaint(q.target));
  const d = $('drops'); d.innerHTML = '';
  for (const p of q.paints) { const b = document.createElement('button'); b.style.background = css(NAMED[p]); b.dataset.paint = p; if (p === 'white') b.style.color = '#2B2140'; b.onclick = () => { if (locked) return; mixCounts[p] = (mixCounts[p] || 0) + 1; mixHistory.push(p); paintBowl(); }; d.appendChild(b); }
  paintBowl();
}
function paintBowl() {
  $('bowl').style.background = Object.keys(mixCounts).length ? css(mixPaint(mixCounts)) : '#fff';
  document.querySelectorAll('#drops button').forEach(b => b.textContent = mixCounts[b.dataset.paint] || '');
}
$('mixUndo').onclick = () => { if (locked) return; const p = mixHistory.pop(); if (p) { mixCounts[p]--; if (!mixCounts[p]) delete mixCounts[p]; } paintBowl(); };
$('mixClear').onclick = () => { if (locked) return; mixCounts = {}; mixHistory = []; paintBowl(); };
$('mixCheck').onclick = () => { if (locked || !Object.keys(mixCounts).length) return; answer(sameRecipe(mixCounts, cur.target), null); };

const PRAISE = ['Yes!', 'Great job!', 'You got it!', 'Super!', 'Nice thinking!', 'Awesome!', 'Correct!'];
function answer(ok, btn) {
  if (locked) return; locked = true;
  const q = cur;
  if (q.type === 'choice') { const bs = [...$('answers').children]; if (btn && !ok) btn.classList.add('wrong'); bs[q.answer].classList.add('right'); }
  const move = record(curSubj, ok);
  if (mode === 'quest') { questLeft--; if (ok) questRight++; }
  if (ok) { sparkle(); const w = pick(PRAISE); say(w); showFeedback(true, w + (q.type === 'number' ? ` ${q.answer} is right.` : ''), move); }
  else { const right = q.type === 'number' ? `The answer is ${q.answer}. ` : ''; say('Not quite. ' + right + q.explain); showFeedback(false, right + q.explain, move); }
}
function showFeedback(good, msg, move) {
  const f = $('feedback'); f.classList.add('on'); f.classList.toggle('good', good); $('fbMsg').textContent = msg;
  $('streak').textContent = P(curSubj).streak ? '🔥 ' + P(curSubj).streak : '';
  if (move) setTimeout(() => levelPop(move), 900);
  else if (good) setTimeout(() => { if (locked && $('feedback').classList.contains('on') && !$('pop').classList.contains('on')) next(); }, 1800);
}
function hideFeedback() { $('feedback').classList.remove('on'); }
$('fbNext').onclick = () => next();

function levelPop(move) {
  const s = SUBJECTS.find(x => x.id === curSubj), p = P(curSubj), lv = s.levels[p.level];
  $('popBig').textContent = move === 'up' ? '🚀' : '🪜';
  $('popTitle').textContent = move === 'up' ? `Level ${p.level + 1}!` : `Let's practice Level ${p.level + 1}`;
  $('popSub').textContent = move === 'up' ? `${s.name}: ${lv.name} (${gradeLabel(lv.grade)})` : `${lv.name} again for a bit. You've got this.`;
  $('pop').classList.add('on'); say(move === 'up' ? `Level up! Now: ${lv.name}.` : `Let's practice ${lv.name} a little more.`);
  if (move === 'up') for (let i = 0; i < 3; i++) setTimeout(sparkle, i * 250);
}
$('popOk').onclick = () => { $('pop').classList.remove('on'); if (mode === 'quest' && questLeft <= 0) return endQuest(); if ($('play').classList.contains('on')) next(); };
function endQuest() {
  hideFeedback(); $('popBig').textContent = questRight >= 8 ? '🏆' : questRight >= 5 ? '🌟' : '👍';
  $('popTitle').textContent = `Quest done! ${questRight} out of 10`; $('popSub').textContent = 'Come back tomorrow for a new quest.';
  $('pop').classList.add('on'); say(`Quest done! You got ${questRight} out of 10.`); mode = 'done';
  $('popOk').onclick = () => { $('pop').classList.remove('on'); $('popOk').onclick = popOkDefault; renderHome(); };
}
const popOkDefault = $('popOk').onclick;

function sparkle() { for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'spark'; s.textContent = pick(['⭐', '✨', '🌟', '🎉']); s.style.left = rnd(10, 90) + 'vw'; s.style.top = rnd(30, 80) + 'vh'; document.body.appendChild(s); requestAnimationFrame(() => { s.style.transform = `translateY(-${rnd(80, 200)}px) rotate(${rnd(-90, 90)}deg)`; s.style.opacity = 0; }); setTimeout(() => s.remove(), 1100); } }

$('back').onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} VOICE.stop(); hideFeedback(); renderHome(); };
$('hear').onclick = () => speakQuestion();
$('skip').onclick = () => { if (mode === 'quest') return; next(); };
buildPad();
renderHome();
// Testing hook (used by the package's headless checks; harmless on the tablet).
window.LEVELUP = { SUBJECTS, record, P, prog: () => prog, mixPaint, sameRecipe, current: () => cur };
</script>
</body>
