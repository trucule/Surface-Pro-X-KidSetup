<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Maker</title>
<!--
  Story Maker. She picks up to three friends from the cast, a place, a kind of story, how much trouble there is and
  how long it should be. The story is then told scene by scene, each scene ending in a choice she makes, and every
  line is read by its own voice: a warm narrator and one voice per character.

  Two ways the words get written:
    - With an API key in config.js (written by the KidTablet module from .env), Claude writes each scene live
      (storyModel, Haiku by default), as JSON lines with speakers and moods. dailyLimit caps stories per day.
    - Without one, a built-in branching story is used, so the app always works offline.
  Two ways the words get spoken:
    - With TTS settings in config.js, each line is synthesized in that speaker's voice: VoiceStudio on the LAN
      (designed voices, see voices.js), else Azure Speech or OpenAI; the Windows voices are the last fallback.
    - Otherwise the Windows voices are used, a different one (and pitch) per character. Static prompts can also
      come from a voice pack (voices/make-voices.py), like the other apps.
  Reading level (Little, 2nd grade, 3rd grade; kept in localStorage story-level): Little is the read-aloud for a
  five-year-old. 2nd and 3rd grade use longer sentences and richer words, highlight each word as it is read, explain
  story words when tapped, offer "I read it myself", and end with questions about the story (stars in story-stars).
-->
<style>
  :root { --ink: #2B2140; --paper: #FFF9F0; --pink: #FF4F8B; --sun: #FFC93C; --sky: #58C7F0; --leaf: #5CD38B; --grape: #9B6BFF; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  body { user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* The right 210px of the header stays clear: the Home pill sits there. */
  header { display: flex; align-items: center; gap: 10px; padding: 10px 210px 10px 14px; }
  #stars { font-size: 22px; font-weight: 900; }
  header h1 { font-size: 26px; margin: 0 auto 0 0; font-weight: 900; }
  .round { border: 4px solid var(--ink); background: #fff; border-radius: 50%; width: 64px; height: 64px; font-size: 30px; cursor: pointer; }
  .round:active { transform: scale(.93); }
  section { min-height: 0; overflow: auto; padding: 0 14px 14px; }
  .q { font-size: 26px; font-weight: 900; margin: 6px 0 8px; }
  .q small { font-weight: 700; font-size: 17px; color: #6A5A86; margin-left: 10px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, 118px); gap: 12px; justify-content: center; margin-bottom: 14px; }
  .pick { border: 4px solid var(--ink); border-radius: 22px; background: #fff; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px; font-weight: 800; font-size: 16px; cursor: pointer; position: relative; }
  .pick .e { font-size: 54px; line-height: 1.1; } .pick .t { font-size: 12px; font-weight: 700; color: #6A5A86; }
  .pick.on { background: var(--sun); } .pick.dim { opacity: .35; }
  .pick .n { position: absolute; top: -10px; right: -10px; width: 30px; height: 30px; border-radius: 50%; background: var(--pink); color: #fff; border: 3px solid var(--ink); display: none; place-items: center; font-weight: 900; }
  .pick.on .n { display: grid; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .row .pick { width: 150px; }
  #go, .big { display: block; margin: 8px auto 20px; border: 4px solid var(--ink); border-radius: 999px; background: var(--leaf); font: 900 26px system-ui, sans-serif; padding: 12px 34px; cursor: pointer; }
  #go:disabled { opacity: .35; }
  #story { display: none; } #story.on { display: block; } #setup.off { display: none; }
  #scene { min-height: 150px; display: flex; align-items: center; justify-content: center; gap: 26px; font-size: 92px; background: #fff; border: 4px solid var(--ink); border-radius: 28px; margin-bottom: 8px; position: relative; }
  #scene span { transition: transform .3s; } #scene span.now { transform: scale(1.25) rotate(-6deg); }
  #title { text-align: center; font-size: 28px; font-weight: 900; margin: 6px 0 10px; }
  #text { font-size: 27px; line-height: 1.5; font-weight: 700; }
  #text p { margin: 0 0 8px; padding: 8px 14px; border-radius: 18px; transition: background .2s; display: flex; gap: 10px; align-items: flex-start; }
  #text p.now { background: #FFF2C2; } #text p.say { background: #fff; border: 3px solid #e4dbf0; margin-left: 24px; }
  #text p.say.now { border-color: var(--ink); background: #FFF2C2; }
  #text .who { font-size: 34px; line-height: 1; flex: none; }
  #text .w { cursor: pointer; border-radius: 6px; padding: 0 2px; } #text .w:active { background: var(--sky); }
  #choices { display: none; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 14px 0; } #choices.on { display: flex; }
  #choices button { border: 4px solid var(--ink); border-radius: 24px; background: var(--sun); font: 900 22px system-ui, sans-serif; padding: 12px 20px; cursor: pointer; display: grid; justify-items: center; gap: 4px; min-width: 160px; }
  #choices button .e { font-size: 44px; } #choices button:active { transform: scale(.95); }
  .bar { display: flex; justify-content: center; gap: 14px; margin: 14px 0; }
  #thinking { display: none; text-align: center; font-size: 24px; font-weight: 800; color: #6A5A86; padding: 20px; } #thinking.on { display: block; }
  #thinking .dots::after { content: "…"; animation: dots 1.2s steps(3) infinite; } @keyframes dots { to { content: ""; } }
  #end { display: none; text-align: center; font-size: 40px; font-weight: 900; margin: 10px 0; } #end.on { display: block; }
  #text.grown { font-size: 29px; line-height: 1.6; font-weight: 600; }
  #text .w.hl { background: var(--sun); box-shadow: 0 0 0 2px var(--sun); }
  #text .w.gw { text-decoration: underline dotted #9B6BFF 3px; text-underline-offset: 5px; }
  #pop { position: fixed; left: 50%; top: 90px; transform: translateX(-50%) scale(.6); opacity: 0; pointer-events: none; transition: .2s; background: #fff; border: 4px solid var(--ink); border-radius: 26px; padding: 14px 28px; text-align: center; z-index: 9; max-width: 70%; box-shadow: 0 8px 0 var(--grape); }
  #pop.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #popWord { font-size: 52px; font-weight: 900; } #popMeaning { font-size: 24px; font-weight: 700; color: #4A3C66; }
  #quiz { display: none; background: #fff; border: 4px solid var(--ink); border-radius: 28px; padding: 16px 20px 20px; margin: 10px auto; max-width: 900px; text-align: center; } #quiz.on { display: block; }
  #qNum { font-size: 18px; font-weight: 800; color: #6A5A86; } #qText { font-size: 30px; font-weight: 900; margin: 6px 0 14px; }
  #qChoices { display: grid; gap: 12px; }
  #qChoices button { border: 4px solid var(--ink); border-radius: 20px; background: #F3EEFF; font: 800 24px system-ui, sans-serif; padding: 14px 18px; cursor: pointer; text-align: left; }
  #qChoices button.right { background: var(--leaf); } #qChoices button.wrong { background: #ffd6d6; opacity: .7; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Story Maker</h1><span id="stars">⭐ 0</span><button class="round" id="back" title="Make another" hidden>⬅️</button></header>
  <section>
    <div id="setup">
      <div class="q">Who is in the story? <small>pick one, two or three friends</small></div><div class="picks" id="cast"></div>
      <div class="q">Where does it happen?</div><div class="picks" id="places"></div>
      <div class="q">What kind of story?</div><div class="row" id="kinds"></div>
      <div class="q">How much trouble?</div><div class="row" id="dramas"></div>
      <div class="q">How long?</div><div class="row" id="lengths"></div>
      <div class="q">Reading level</div><div class="row" id="levels"></div>
      <button id="go" disabled>Tell the story! 📖</button>
    </div>
    <div id="story">
      <div id="title"></div>
      <div id="scene"></div>
      <div id="text"></div>
      <div id="thinking">The story is being written<span class="dots"></span></div>
      <div id="choices"></div>
      <div id="end">The End ⭐</div>
      <div id="quiz"><div id="qNum"></div><div id="qText"></div><div id="qChoices"></div></div>
      <div class="bar"><button class="round" id="read" title="Read this part again">🔈</button><button class="round" id="mode" title="Read to me">👂</button><button class="round" id="another" title="New story, same friends">🎲</button></div>
    </div>
  </section>
  <div id="pop"><div id="popWord"></div><div id="popMeaning"></div></div>
</div>
<script src="config.js"></script>
<script src="voices.js"></script>
<script id="voicepack">/* voice pack goes here: run voices/make-voices.py */</script>
<script>
// ---------------------------------------------------------------------------
// The cast. Each friend has a personality the writer keeps to, and a voice: Azure and OpenAI voice names for live
// TTS, and a pitch/rate for the Windows voices so they still sound different from each other.
// ---------------------------------------------------------------------------
const CAST = [
  { id: 'bun', name: 'Bun', emoji: '🐰', kind: 'bunny', trait: 'a kindly elderly gentleman rabbit who speaks in a gentle British way, tells short "in my day" stories, wise and warm', azure: 'en-US-JaneNeural', openai: 'shimmer', pitch: 1.3, rate: 1.0 },
  { id: 'spark', name: 'Spark', emoji: '🐉', kind: 'little dragon', trait: 'silly, sneezes tiny sparks, loves jokes', azure: 'en-US-DavisNeural', openai: 'echo', pitch: 0.8, rate: 0.95 },
  { id: 'beep', name: 'Beep', emoji: '🤖', kind: 'robot', trait: 'curious, counts things, says beep boop', azure: 'en-US-TonyNeural', openai: 'onyx', pitch: 0.7, rate: 1.05 },
  { id: 'twinkle', name: 'Twinkle', emoji: '🦄', kind: 'unicorn', trait: 'confident, strong and capable, the leader who keeps everyone safe and makes the plan', azure: 'en-US-AriaNeural', openai: 'nova', pitch: 1.4, rate: 0.9 },
  { id: 'pip', name: 'Pip', emoji: '🐧', kind: 'penguin', trait: 'shy at first, very loyal, loves sliding', azure: 'en-US-SaraNeural', openai: 'fable', pitch: 1.2, rate: 1.0 },
  { id: 'scarlett', name: 'Scarlett', emoji: '👧', kind: 'girl', trait: 'clever and bold, has good ideas', azure: 'en-US-AnaNeural', openai: 'shimmer', pitch: 1.5, rate: 1.0 },
  { id: 'hop', name: 'Hop', emoji: '🐸', kind: 'frog', trait: 'jumpy and loud, says RIBBIT when surprised', azure: 'en-US-JasonNeural', openai: 'echo', pitch: 0.9, rate: 1.15 },
  { id: 'rusty', name: 'Rusty', emoji: '🦊', kind: 'fox', trait: 'tricky but good-hearted, always has a plan', azure: 'en-US-GuyNeural', openai: 'onyx', pitch: 1.0, rate: 1.05 },
  { id: 'luna', name: 'Luna', emoji: '🦉', kind: 'owl', trait: 'wise and calm, speaks slowly, knows facts', azure: 'en-US-NancyNeural', openai: 'alloy', pitch: 0.9, rate: 0.8 },
  { id: 'mo', name: 'Mo', emoji: '🫎', kind: 'moose', trait: 'big, gentle and a little clumsy', azure: 'en-US-ChristopherNeural', openai: 'onyx', pitch: 0.6, rate: 0.85 },
  { id: 'zip', name: 'Zip', emoji: '🐭', kind: 'mouse', trait: 'tiny and fast, talks quickly, scared of nothing', azure: 'en-US-AmberNeural', openai: 'nova', pitch: 1.6, rate: 1.2 },
  { id: 'captain', name: 'Captain Clam', emoji: '🦀', kind: 'crab', trait: 'bossy old sailor, says Arr, secretly soft', azure: 'en-US-BrandonNeural', openai: 'echo', pitch: 0.75, rate: 0.9 }
];
const NARRATOR = { id: 'narrator', name: 'Narrator', emoji: '📖', azure: 'en-US-JennyNeural', openai: 'nova', pitch: 1.0, rate: 0.92 };
const PLACES = [['🏰', 'a castle'], ['🌙', 'the moon'], ['🏝️', 'an island'], ['🌲', 'a forest'], ['🏖️', 'the beach'], ['🎡', 'a fair'], ['❄️', 'a snowy mountain'], ['🧁', 'cupcake town'], ['🚂', 'a train'], ['🌊', 'under the sea']];
const KINDS = [['🧭', 'adventure', 'Adventure'], ['🔍', 'mystery', 'Mystery'], ['💛', 'friendship', 'Friendship'], ['🤪', 'silly', 'Silly'], ['🌙', 'bedtime', 'Bedtime']];
const DRAMAS = [['☁️', 'cozy', 'Cozy', 'no real problem, just a happy time together'], ['🌦️', 'little', 'A little trouble', 'one small problem that friends solve kindly'], ['⛈️', 'big', 'Big trouble', 'an exciting safe scare, like getting lost or a storm, that ends well']];
const LENGTHS = [['📄', 3, 'Short'], ['📚', 6, 'Long']];
const CFG = Object.assign({ storyModel: 'claude-haiku-4-5-20251001', dailyLimit: 10, tts: null }, window.DWM_CONFIG || {});
let picked = [], place = null, kind = null, drama = null, length = null;
let story = null;   // { scenes: [...], history: [...], reading }
const $ = id => document.getElementById(id);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------------------------------------------------------------------------
// Voices
// ---------------------------------------------------------------------------
const VOICE = (() => {
  let actx = null, cur = null, seq = 0, timers = []; const cache = new Map();
  const key = t => String(t).trim().toLowerCase().replace(/\s+/g, ' ');
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  // Every line gets a number; stopping (or starting another line) retires it, so a late "done" from a line that was
  // cut off never moves the story on.
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function stop() { seq++; clearTimers(); if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } try { speechSynthesis.cancel(); } catch (e) {} }
  // Read-along: with a clip the words are timed across its length by their size; the Windows voice reports each word.
  function wordStarts(text) { const s = []; let pos = 0; for (const w of text.split(' ')) { s.push(pos); pos += w.length + 1; } return s; }
  function scheduleWords(text, seconds, onWord) {
    if (!onWord) return;
    const words = text.split(' '), total = words.reduce((n, w) => n + w.length + 1, 0); let t = 0;
    words.forEach((w, i) => { timers.push(setTimeout(() => onWord(i), t * 1000)); t += seconds * (w.length + 1) / total; });
  }
  // Effects applied to a character's audio: "robot" is a ring modulator plus a touch of bit crushing.
  function chain(a, fx) {
    const out = a.createGain(); out.gain.value = 1;
    if (fx !== 'robot') { out.connect(a.destination); return out; }
    const ring = a.createGain(); ring.gain.value = 0; const lfo = a.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 55; lfo.connect(ring.gain); lfo.start();
    const dry = a.createGain(); dry.gain.value = 0.35; const wet = a.createGain(); wet.gain.value = 0.9;
    const crush = a.createWaveShaper(); const n = 256, curve = new Float32Array(n); const levels = 24; for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = Math.round(x * levels) / levels; } crush.curve = curve;
    const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220; const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3400;
    out.connect(ring); ring.connect(wet); out.connect(dry); wet.connect(crush); dry.connect(crush); crush.connect(hp).connect(lp).connect(a.destination);
    return out;
  }
  function playBuffer(buf, done, fx, text, onWord) { const a = ctx(); const s = a.createBufferSource(); s.buffer = buf; s.connect(chain(a, fx)); s.onended = () => { if (cur === s) { cur = null; if (done) done(); } }; cur = s; s.start(); if (text) scheduleWords(text, buf.duration, onWord); }
  async function decode(bytes) { const a = ctx(); return a.decodeAudioData(bytes.slice(0)); }
  const vsCfg = () => (window.VS_VOICES || {});
  function fxFor(who) { const v = vsCfg()[who.id]; return v && v.fx; }

  // --- VoiceStudio on the LAN (designed voices, GPU on the PC) -------------------------------------
  // Each story picks its voice service once, at its start: VoiceStudio when the PC answers, otherwise the Azure or
  // OpenAI key, otherwise the Windows voices. A story that started without VoiceStudio does not ask the PC again,
  // and a VoiceStudio story that loses the PC switches to the key for the rest of that story. The next story
  // checks the PC again.
  const vs = { ok: null, at: 0, ids: null, active: 0, queue: [] };
  // The secret is the LAN-share PIN or, with OMNIVOICE_API_KEY set on the PC, that key; send it both ways.
  const vsHeaders = t => (t.pin ? { 'x-omnivoice-pin': t.pin, 'Authorization': 'Bearer ' + t.pin } : {});
  async function vsAlive(t) {
    vs.at = Date.now();
    try { const c = new AbortController(); const tm = setTimeout(() => c.abort(), 2000); const r = await fetch(t.url + '/health', { headers: vsHeaders(t), signal: c.signal }); clearTimeout(tm); vs.ok = r.ok; }
    catch (e) { vs.ok = false; }
    if (!vs.ok) vs.ids = null;
    return vs.ok;
  }
  // The key's service: 'azure' or 'openai' (VoiceStudio's fallback, or the primary), or null for none.
  function keyService(t) {
    if (!t || !t.key) return null;
    if (t.provider === 'openai') return 'openai';
    if (t.provider === 'azure') return 'azure';
    if (t.fallback === 'none') return null;
    return t.fallback === 'openai' ? 'openai' : 'azure';
  }
  // route: Promise of 'vs' | 'azure' | 'openai' | null for the current story.
  let route = null;
  function decide() {
    const t = CFG.tts;
    if (!t) return Promise.resolve(null);
    if (t.provider === 'voicestudio' && t.url) return vsAlive(t).then(ok => ok ? 'vs' : keyService(t));
    return Promise.resolve(keyService(t));
  }
  function currentRoute() { if (!route) route = decide(); return route; }
  function beginStory() { route = decide(); if (!azList) azMapP = null; return route; }
  function dropVoiceStudio() { route = Promise.resolve(keyService(CFG.tts)); }

  // --- Azure: one voice per character, from the voices this key's region offers ---------------------
  // Each character asks for its own voice; a voice the region does not have is replaced by an unused one of the
  // same kind (girl, woman, man), so the cast still sounds like several people.
  const AZ_KIND = { 'en-US-AnaNeural': 'child', 'en-US-JaneNeural': 'f', 'en-US-AriaNeural': 'f', 'en-US-SaraNeural': 'f', 'en-US-NancyNeural': 'f', 'en-US-AmberNeural': 'f', 'en-US-JennyNeural': 'f',
                    'en-US-DavisNeural': 'm', 'en-US-TonyNeural': 'm', 'en-US-JasonNeural': 'm', 'en-US-GuyNeural': 'm', 'en-US-ChristopherNeural': 'm', 'en-US-BrandonNeural': 'm' };
  let azList = null, azMap = null;
  let azListP = null;
  function azureVoices(t) { if (!azListP) azListP = loadAzureVoices(t); return azListP; }
  async function loadAzureVoices(t) {
    if (azList) return azList;
    const LK = 'sm-azure-voices';
    try { const c = JSON.parse(localStorage.getItem(LK) || 'null'); if (c && c.region === t.region && Date.now() - c.at < 864e5 && c.voices.length) return (azList = c.voices); } catch (e) {}
    try {
      const c = new AbortController(); const tm = setTimeout(() => c.abort(), 4000);
      const r = await fetch(`https://${t.region || 'eastus'}.tts.speech.microsoft.com/cognitiveservices/voices/list`, { headers: { 'Ocp-Apim-Subscription-Key': t.key }, signal: c.signal });
      clearTimeout(tm);
      if (r.ok) {
        const all = await r.json();
        azList = all.filter(v => /^en-/i.test(v.Locale) && /neural/i.test(v.VoiceType || 'Neural') && !/:/.test(v.ShortName))
          .map(v => ({ name: v.ShortName, kind: /child|girl|boy/i.test(JSON.stringify(v.VoiceTag || '')) || v.ShortName === 'en-US-AnaNeural' ? 'child' : (v.Gender === 'Female' ? 'f' : 'm'), us: /^en-US/i.test(v.Locale) }));
        try { localStorage.setItem(LK, JSON.stringify({ region: t.region, at: Date.now(), voices: azList })); } catch (e) {}
        return azList;
      }
    } catch (e) {}
    return null;
  }
  let azMapP = null;
  async function azureVoiceFor(t, who) {
    if (!azMapP) azMapP = buildAzureMap(t);
    await azMapP;
    return azMap[who.id] || who.azure;
  }
  async function buildAzureMap(t) {
    {
      const list = await azureVoices(t);
      azMap = {};
      const everyone = [NARRATOR, ...CAST];
      if (!list) { for (const c of everyone) azMap[c.id] = c.azure; }
      else {
        const have = new Set(list.map(v => v.name)), used = new Set();
        for (const c of everyone) if (have.has(c.azure) && !used.has(c.azure)) { azMap[c.id] = c.azure; used.add(c.azure); }
        for (const c of everyone) {
          if (azMap[c.id]) continue;
          const kind = AZ_KIND[c.azure] || 'f', free = v => !used.has(v.name);
          const v = list.find(v => free(v) && v.kind === kind && v.us) || list.find(v => free(v) && v.kind === kind) || list.find(v => free(v) && v.us) || list.find(free) || list[0];
          azMap[c.id] = v ? v.name : c.azure; used.add(azMap[c.id]);
        }
      }
    }
    if (!Object.keys(azMap).length || !azList) azListP = null;   // list not reached: ask again next story
  }
  async function vsVoiceId(t, who) {
    if (!vs.ids) {
      if (!vs.idsP) vs.idsP = (async () => {
        try { const r = await fetch(t.url + '/v1/audio/voices', { headers: vsHeaders(t) }); const j = await r.json(); const ids = {}; for (const v of (j.voices || [])) if (v.type === 'profile') ids[String(v.name).toLowerCase()] = v.voice_id; vs.ids = ids; }
        catch (e) { vs.ids = null; vs.ok = false; }
        vs.idsP = null;
      })();
      await vs.idsP; if (!vs.ids) return null;
    }
    const v = vsCfg()[who.id]; const name = (v && v.profile) || who.name; return vs.ids[String(name).toLowerCase()] || null;
  }
  // The GPU renders one line at a time; two in flight keeps it busy without starving the line being read.
  function vsSlot() { return new Promise(res => { vs.queue.push(res); vsPump(); }); }
  function vsPump() { while (vs.active < 2 && vs.queue.length) { vs.active++; vs.queue.shift()(); } }
  function vsRelease() { vs.active--; vsPump(); }
  async function vsSynth(t, text, who) {
    await vsSlot();   // taken in call order, so a scene renders in reading order
    try {
      if (vs.ok === false) return null;   // the PC dropped out earlier in this story
      const id = await vsVoiceId(t, who); if (!id) return null;
      const v = vsCfg()[who.id] || {};
      const fd = new FormData(); fd.append('text', text); fd.append('profile_id', id);

function fill(t) {
  const names = picked.map(c => c.name), at = i => names[Math.min(i, names.length - 1)];
  const list = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  const where = place[1];
  return t.replace(/\{A\}/g, at(0)).replace(/\{B\}/g, at(1)).replace(/\{C\}/g, at(2)).replace(/\{list\}/g, list)
          .replace(/^\{place\}/, cap(where)).replace(/\{place\}/g, where);
}
function plotScene() {
  const plot = PLOTS[kind[1]], n = Math.min(story.scenes.length, plot.scenes.length - 1), sc = plot.scenes[n];
  const key = n ? story.history[n - 1].key : null, g3 = story.level === 'third';
  const defs = Array.isArray(sc.lines) ? sc.lines : [...(sc.lines[key] || []), ...sc.lines.common];
  const lines = defs.map(d => d[0] === N ? { who: NARRATOR, text: fill(g3 ? d[2] : d[1]), mood: 'neutral' } : { who: picked[d[0] % picked.length], text: fill(d[1]), mood: d[2] || 'neutral' });
  const emoji = [...picked.slice(0, 2).map(c => c.emoji), plot.emoji[n]];
  const all = lines.map(l => l.text).join(' ').toLowerCase();
  const words = Object.entries(plot.words).filter(([w]) => new RegExp('\\b' + w + '\\b').test(all)).map(([word, meaning]) => ({ word, meaning }));
  return { title: typeof sc.title === 'string' ? sc.title : sc.title[key], emoji, lines, summary: sc.summary, choices: sc.choices || [], end: !!sc.end, words };
}
function builtinScene() { return story.level === 'little' ? littleScene() : plotScene(); }

// ---------------------------------------------------------------------------
// Questions after the story. Each has exactly one right answer among three.
// ---------------------------------------------------------------------------
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mkQ(q, right, wrong) {
  const choices = shuffle([right, ...wrong.filter(w => w && w.toLowerCase() !== right.toLowerCase()).slice(0, 2)]);
  return { q, choices, answer: choices.indexOf(right) };
}
function cleanQuestions(qs) {
  if (!Array.isArray(qs)) return [];
  const out = [];
  for (const x of qs) {
    if (!x || typeof x.q !== 'string' || !Array.isArray(x.choices)) continue;
    const choices = x.choices.map(c => String(c || '').trim()).filter(Boolean);
    const a = Number(x.answer);
    if (choices.length < 2 || choices.length > 4 || !Number.isInteger(a) || a < 0 || a >= choices.length) continue;
    if (new Set(choices.map(c => c.toLowerCase())).size !== choices.length) continue;
    out.push(mkQ(x.q.trim(), choices[a], choices.filter((c, i) => i !== a)));
  }
  return out;
}
function storyQuestions() {
  const s = story, qs = [];
  const others = CAST.filter(c => !picked.includes(c) && c.id !== 'scarlett');   // never offer her own name as a wrong answer
  qs.push(mkQ('Who was in the story?', pick(picked).name, shuffle(others).slice(0, 2).map(c => c.name)));
  qs.push(mkQ('Where did the story happen?', cap(place[1]), shuffle(PLACES.filter(p => p !== place)).slice(0, 2).map(p => cap(p[1]))));
  if (s.history.length && s.history[0].others.length) {
    const elsewhere = Object.values(PLOTS).flatMap(p => p.scenes.flatMap(sc => (sc.choices || []).map(c => c.label))).filter(l => !s.history.some(h => h.choice === l || h.others.includes(l)));
    qs.push(mkQ('What did you choose to do first?', s.history[0].choice, [s.history[0].others[0], pick(elsewhere)]));
  }
  if (s.level === 'little') return qs;
  if (s.ai) { const ai = s.scenes.flatMap(sc => sc.questions || []); return ai.length >= 4 ? ai.slice(0, 5) : ai.concat(qs).slice(0, 4); }   // topped up from the story itself
  const plot = PLOTS[kind[1]];
  for (const [q, a, w] of plot.questions) qs.push(mkQ(q, a, w));
  const used = s.scenes.flatMap(sc => sc.words || []);
  if (used.length) {
    const w = pick(used), wrong = shuffle(Object.entries(plot.words).filter(([k]) => k !== w.word).map(([, m]) => m));
    qs.push(mkQ(`In the story, what does "${w.word}" mean?`, w.meaning, wrong));
  }
  return qs.slice(0, 6);
}

// ---------------------------------------------------------------------------
// Telling it
// ---------------------------------------------------------------------------
async function start(sameFriends) {
  story = { scenes: [], history: [], reading: -1, ai: canUseAI(), level: level[1], glossary: {} };
  VOICE.beginStory();   // which voice service this story uses, decided once
  if (story.ai) countStory();
  $('setup').classList.add('off'); $('story').classList.add('on'); $('back').hidden = false; $('end').classList.remove('on'); $('quiz').classList.remove('on');
  $('title').textContent = ''; $('scene').innerHTML = ''; $('text').innerHTML = '';
  $('text').classList.toggle('grown', grown());
  showMode();
  await nextScene();
}
async function nextScene() {
  $('choices').classList.remove('on'); $('choices').innerHTML = ''; $('thinking').classList.add('on');
  let scene;
  try { scene = story.ai ? await writeScene() : builtinScene(); }
  catch (e) { console.warn('writer failed, using the built-in story', e); story.ai = false; scene = builtinScene(); }
  $('thinking').classList.remove('on');
  for (const w of (scene.words || [])) story.glossary[w.word.toLowerCase()] = w.meaning;
  story.scenes.push(scene); showScene(scene);
}
const bare = w => w.replace(/^[^\w']+|[^\w']+$/g, '');
function showScene(scene) {
  $('title').textContent = scene.title || '';
  const sc = $('scene'); sc.innerHTML = ''; for (const e of (scene.emoji || []).slice(0, 4)) { const s = document.createElement('span'); s.textContent = e; sc.appendChild(s); }
  const text = $('text'); text.innerHTML = '';
  scene.lines.forEach((l, i) => {
    const p = document.createElement('p'); if (l.who !== NARRATOR) { p.className = 'say'; const w = document.createElement('span'); w.className = 'who'; w.textContent = l.who.emoji; p.appendChild(w); }
    const body = document.createElement('span'); p.words = [];
    for (const word of l.text.split(' ')) {
      const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = word + ' ';
      if (story.glossary[bare(word).toLowerCase()]) sp.classList.add('gw');
      sp.onclick = (e) => { e.stopPropagation(); tapWord(word, i); };
      body.appendChild(sp); p.words.push(sp);
    }
    p.appendChild(body); p.onclick = () => readFrom(i, selfRead); text.appendChild(p);
  });
  if (selfRead) { story.reading = -1; afterScene(scene, true); return; }
  // Request every line of the scene now; the GPU works through them in order while the first ones play.
  VOICE.prefetchAll(scene.lines);
  readFrom(0);
}
function highlight(line, word) {
  document.querySelectorAll('#text .w.hl').forEach(x => x.classList.remove('hl'));
  const p = $('text').children[line]; if (p && p.words && word >= 0 && p.words[word]) p.words[word].classList.add('hl');
}
// Tapping a word says it (and what it means, for a story word). Reading picks up again at the same line.
function tapWord(word, line) {
  const w = bare(word); if (!w) return;
  const meaning = story.glossary[w.toLowerCase()], wasReading = !selfRead && story.reading >= 0 && story.reading < story.scenes[story.scenes.length - 1].lines.length;
  story.reading = -2;
  $('popWord').textContent = w; $('popMeaning').textContent = meaning || ''; $('pop').classList.add('on');
  clearTimeout(tapWord.t); tapWord.t = setTimeout(() => $('pop').classList.remove('on'), meaning ? 4500 : 2000);
  highlight(-1, -1);
  VOICE.say(meaning ? `${w}. ${w} means ${meaning}.` : w, NARRATOR, null, () => { if (wasReading && story && story.reading === -2) setTimeout(() => readFrom(line), 400); });
}
function readFrom(i, once) {
  const scene = story && story.scenes[story.scenes.length - 1]; if (!scene) return; story.reading = i;
  const ps = $('text').children; [...ps].forEach((p, k) => p.classList.toggle('now', k === i));
  [...$('scene').children].forEach(s => s.classList.remove('now'));
  if (i >= scene.lines.length) { VOICE.stop(); highlight(-1, -1); afterScene(scene); return; }
  const l = scene.lines[i]; if (l.who !== NARRATOR) { const idx = (scene.emoji || []).indexOf(l.who.emoji); if (idx >= 0) $('scene').children[idx].classList.add('now'); }
  if (!once && i + 2 < scene.lines.length) VOICE.prefetch(scene.lines[i + 2].text, scene.lines[i + 2].who, scene.lines[i + 2].mood);
  ps[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  VOICE.say(l.text, l.who, l.mood, () => {
    highlight(-1, -1);
    if (once) { if (story.reading === i) { story.reading = -1; ps[i].classList.remove('now'); } return; }
    if (story.reading === i) setTimeout(() => { if (story && story.reading === i) readFrom(i + 1); }, 300);
  }, w => { if (story && story.reading === i) highlight(i, w); });
}
function afterScene(scene, quiet) {
  if (scene.end || !scene.choices.length) { $('end').classList.add('on'); if (grown()) { startQuiz(); } else say('The end! Tap the dice for another story.'); return; }
  const box = $('choices'); box.innerHTML = '';
  for (const c of scene.choices) {
    const b = document.createElement('button'); const e = document.createElement('span'); e.className = 'e'; e.textContent = c.emoji || '✨'; b.appendChild(e); b.appendChild(document.createTextNode(c.label));
    b.onclick = () => { VOICE.stop(); story.history.push({ title: scene.title, summary: scene.summary || scene.title, choice: c.label, key: c.key, others: scene.choices.filter(x => x !== c).map(x => x.label) }); say(c.label + '!'); nextScene(); };
    box.appendChild(b);
  }
  box.classList.add('on'); if (!quiet) say('What should happen next?');
  if (!quiet) $('choices').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// The quiz: one question at a time, read aloud. A star for each one right on the first try.
let quiz = null;
function startQuiz() {
  quiz = { qs: storyQuestions(), i: 0, first: 0, missed: false };
  $('quiz').classList.add('on'); showQuestion();
  $('quiz').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function showQuestion() {

  q.choices.forEach((c, k) => {
    const b = document.createElement('button'); b.textContent = c;
    b.onclick = () => {
      if (quiz.done || b.disabled) return;
      if (k === q.answer) {
        b.classList.add('right'); [...box.children].forEach(x => x.disabled = true);
        if (!quiz.missed) { quiz.first++; stars++; store.set('story-stars', stars); $('stars').textContent = '⭐ ' + stars; }
        say(pick(['Yes! You got it.', 'That is right!', 'Great reading!']));
        setTimeout(() => { quiz.i++; if (quiz.i < quiz.qs.length) showQuestion(); else endQuiz(); }, 1400);
      } else { b.classList.add('wrong'); b.disabled = true; quiz.missed = true; say('Not quite. Think about the story and try again.'); }
    };

  });

}
function endQuiz() {
  quiz.done = true;
  $('qNum').textContent = ''; $('qText').textContent = `You got ${quiz.first} of ${quiz.qs.length} on the first try!`; $('qChoices').innerHTML = '';
  say(`You got ${quiz.first} of ${quiz.qs.length} on the first try! Tap the dice for another story.`);
}
function showMode() { $('mode').textContent = selfRead ? '👀' : '👂'; $('mode').title = selfRead ? 'I read it myself (tap to have it read to you)' : 'Read to me (tap to read it yourself)'; }
$('mode').onclick = () => {
  selfRead = !selfRead; store.set('story-self-read', selfRead); showMode();
  say(selfRead ? 'You read it. Tap a word if you need help.' : 'I will read it to you.');
  const scene = story && story.scenes[story.scenes.length - 1];
  if (scene && !selfRead && !$('choices').classList.contains('on') && !scene.end) readFrom(0);
  else if (scene && selfRead && !$('choices').classList.contains('on') && !scene.end) { VOICE.stop(); story.reading = -1; highlight(-1, -1); afterScene(scene, true); }
};
$('go').onclick = () => start();
$('read').onclick = () => { if (story) readFrom(0); };
$('another').onclick = () => { VOICE.stop(); start(true); };
$('back').onclick = () => { VOICE.stop(); story = null; $('setup').classList.remove('off'); $('story').classList.remove('on'); $('back').hidden = true; };
$('stars').textContent = '⭐ ' + stars;
try { speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
addEventListener('pointerdown', () => say('Story Maker! Who is in the story?'), { once: true });
const pickArgs = (ids, p, k, d, l, lv) => { picked = ids.map(id => CAST.find(c => c.id === id)); place = PLACES[p]; kind = KINDS[k]; drama = DRAMAS[d]; length = LENGTHS[l]; if (lv !== undefined) level = LEVELS[lv]; };
window.STORY = { cfg: CFG, CAST, PLACES, KINDS, LEVELS, PLOTS, get story() { return story; }, get quiz() { return quiz; }, start, pick: pickArgs, builtinScene, storyQuestions, cleanQuestions, VOICE, setSelfRead: v => { selfRead = v; showMode(); } };
window.SM = window.STORY;
</script>
