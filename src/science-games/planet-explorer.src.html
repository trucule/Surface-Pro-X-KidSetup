<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>

<title>Planet Explorer</title>
<!--
  Planet Explorer. Fly around a 3D solar system, land on worlds and jump to feel their gravity, and answer quests.
  One file, offline, no network.
  Facts come from the NASA Planetary Fact Sheet: diameter, surface gravity, length of a day (sunrise to sunrise),
  spin, axial tilt, length of a year and distance from the Sun. Relative values are kept true:
    Jump height is the same push on every world, so it is 1 foot on Earth times 9.8 divided by the world's gravity
    (about 6 feet on the Moon, 2 and a half on Mars, less than half a foot on Jupiter). The jump plays in slow motion,
    twice as slow everywhere, so the hang times keep their true ratio.
    Orbits and spins run at their true relative speeds. Planets are tilted by their real axial tilt.
    The space view spreads the planets out and enlarges the small ones so they can be tapped. The Look closer view
    shows two worlds at their true relative size.
  Quests: find a planet, planet order, bigger or smaller, jump tests, day length, how high, seasons, year length,
  weight on other worlds and mystery planets.
  Four right first try in a row moves up a level; two missed quests in a row moves down.
  Progress is kept in localStorage (key planet-explorer-v1). New players start at a 2nd grade level.
  Test hook: window.PLANET_EXPLORER.
  three.js r149 is inlined below under its MIT License (Copyright 2010-2023 three.js authors).
-->
<style>

  button { font-family: inherit; color: var(--ink); }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
  /* The right 210px of the header stays clear: the Home pill sits there. */
  header { display: flex; align-items: center; gap: 10px; padding: 10px 210px 10px 14px; background: linear-gradient(90deg, #9B6BFF, #FF4F8B); border-bottom: 4px solid var(--ink); z-index: 3; }

  .ans { border: 5px solid var(--ink); border-radius: 26px; padding: 14px 24px; font-size: 27px; font-weight: 900; cursor: pointer; box-shadow: 0 7px 0 var(--ink); background: #fff; display: flex; align-items: center; gap: 10px; }

  .tool.big { background: var(--sun); font-size: 30px; padding: 14px 30px; }

  #card .c small { display: block; font-size: 22px; font-weight: 700; margin-top: 8px; line-height: 1.35; }

<script>/*@@THREE@@*/</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------------------------------------------------------------------------
// Facts (NASA Planetary Fact Sheet). d: diameter km, g: surface gravity m/s2, day: sunrise to sunrise in hours,
// spin: one turn in hours (minus means it spins backwards), tilt: axial tilt in degrees, year: Earth days,
// dist: million km from the Sun, temp: mean temperature in C.
// ---------------------------------------------------------------------------
const DATA = {
  Mercury: { d: 4879, g: 3.7, day: 4222.6, spin: 1407.6, tilt: 0.034, year: 88.0, dist: 57.9, temp: 167, col: '#B9B2C9', solid: true },
  Venus: { d: 12104, g: 8.9, day: 2802.0, spin: -5832.5, tilt: 177.4, year: 224.7, dist: 108.2, temp: 464, col: '#FFC46B', solid: true },
  Earth: { d: 12756, g: 9.8, day: 24.0, spin: 23.9, tilt: 23.4, year: 365.2, dist: 149.6, temp: 15, col: '#3D8BFF', solid: true },
  Moon: { d: 3475, g: 1.6, day: 708.7, spin: 655.7, tilt: 1.5, year: null, dist: null, temp: -20, col: '#D8D4E6', solid: true, moon: true },
  Mars: { d: 6792, g: 3.7, day: 24.7, spin: 24.6, tilt: 25.2, year: 687.0, dist: 228.0, temp: -65, col: '#FF6A3D', solid: true },
  Jupiter: { d: 142984, g: 23.1, day: 9.9, spin: 9.9, tilt: 3.1, year: 4331, dist: 778.5, temp: -110, col: '#F0A15A' },
  Saturn: { d: 120536, g: 9.0, day: 10.7, spin: 10.7, tilt: 26.7, year: 10747, dist: 1432.0, temp: -140, col: '#F7D27A' },
  Uranus: { d: 51118, g: 8.7, day: 17.2, spin: -17.2, tilt: 97.8, year: 30589, dist: 2867.0, temp: -195, col: '#7FF0F0' },
  Neptune: { d: 49528, g: 11.0, day: 16.1, spin: 16.1, tilt: 28.3, year: 59800, dist: 4515.0, temp: -200, col: '#4C6BFF' },
};
const PLANETS = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
const WORLDS = [...PLANETS.slice(0, 3), 'Moon', ...PLANETS.slice(3)];
const G_EARTH = 9.8;
const jumpFt = w => G_EARTH / DATA[w].g;            // a 1 foot Earth jump
const weightOn = (w, lb) => lb * DATA[w].g / G_EARTH;
const seasonTilt = w => Math.min(DATA[w].tilt, 180 - DATA[w].tilt); // how tipped it is, ignoring which way it spins
const ORD = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'];
function dayText(w) { const h = DATA[w].day; return h < 48 ? 'about ' + Math.round(h) + ' hours' : 'about ' + Math.round(h / 24) + ' Earth days'; }
function yearText(w) { const y = DATA[w].year; if (!y) return 'it goes around Earth'; return y < 1000 ? 'about ' + Math.round(y) + ' Earth days' : 'about ' + Math.round(y / 365.25) + ' Earth years'; }
function ftText(x) { return x >= 4 ? Math.round(x) + ' feet' : (Math.round(x * 10) / 10) + (Math.abs(x - 1) < 0.05 ? ' foot' : ' feet'); }
const isWorld = w => w === 'Moon' ? 'the Moon' : w;
const Cap = s => s[0].toUpperCase() + s.slice(1);

// ---------------------------------------------------------------------------
// Quests
// ---------------------------------------------------------------------------
// Two worlds that differ clearly on f, by at least a ratio (or by a difference when diff is set).
function pairBy(pool, f, min, diff) {
  for (let k = 0; k < 200; k++) {
    const [a, b] = shuffle(pool.slice()).slice(0, 2), x = f(a), y = f(b);
    if (diff ? Math.abs(x - y) >= min : Math.max(x, y) / Math.min(x, y) >= min) return [a, b];
  }
  throw new Error('no pair');
}
const times = r => r < 1.75 ? 'about one and a half times' : 'about ' + Math.round(r) + ' times';
function choiceQuest(text, choices, ans, why, topic, worlds) { return { kind: 'choice', text, choices, ans, why, topic, worlds }; }
const HOW_HIGH = [['about 6 feet', x => x >= 4], ['about 2 and a half feet', x => x >= 2 && x < 4], ['about 1 foot', x => x >= 0.75 && x < 1.5], ['less than half a foot', x => x < 0.6]];
const catOf = x => HOW_HIGH.find(c => c[1](x))[0];
const CLUES = {
  Mercury: [['I am the closest planet to the Sun.', () => PLANETS[0] === 'Mercury'], ['I am the smallest planet.', () => argBy(PLANETS, w => -DATA[w].d) === 'Mercury'], ['My year is only 88 days long.', () => Math.round(DATA.Mercury.year) === 88]],
  Venus: [['I am the hottest planet.', () => argBy(PLANETS, w => DATA[w].temp) === 'Venus'], ['I spin backwards, so my Sun rises in the west.', () => DATA.Venus.spin < 0], ['I am the second planet from the Sun.', () => PLANETS[1] === 'Venus']],
  Earth: [['I have oceans of liquid water on my outside.', null], ['I am the third planet from the Sun.', () => PLANETS[2] === 'Earth'], ['My day is 24 hours long.', () => Math.round(DATA.Earth.day) === 24]],
  Mars: [['I am the red planet.', null], ['I have the tallest volcano of all the planets.', null], ['I am the fourth planet from the Sun.', () => PLANETS[3] === 'Mars']],
  Jupiter: [['I am the biggest planet.', () => argBy(PLANETS, w => DATA[w].d) === 'Jupiter'], ['I have the shortest day, about 10 hours.', () => argBy(PLANETS, w => -DATA[w].day) === 'Jupiter'], ['I have a giant storm called the Great Red Spot.', null]],
  Saturn: [['I have the biggest, brightest rings.', null], ['I am the sixth planet from the Sun.', () => PLANETS[5] === 'Saturn'], ['I am so light for my size that I could float in a giant bathtub.', null]],
  Uranus: [['I spin tipped over on my side.', () => argBy(PLANETS, seasonTilt) === 'Uranus'], ['I am the seventh planet from the Sun.', () => PLANETS[6] === 'Uranus'], ['I am an ice giant, and I look blue-green.', null]],
  Neptune: [['I am the farthest planet from the Sun.', () => PLANETS[7] === 'Neptune'], ['My year is about 164 Earth years long.', () => Math.round(DATA.Neptune.year / 365.25) === 164], ['I have the fastest winds of all the planets.', null]],
};
function argBy(list, f) { return list.reduce((a, b) => (f(b) > f(a) ? b : a)); }

const LEVELS = [

function record(right) {

  }

const platform = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 0.3, 32), new THREE.MeshStandardMaterial({ color: 0x9B6BFF, metalness: 0.4, roughness: 0.4 })); platform.position.y = -0.15; surface.add(platform);
const dust = []; const dustG = new THREE.SphereGeometry(0.08, 6, 4);
const surfLight = new THREE.DirectionalLight(0xffffff, 1.0); surfLight.position.set(5, 10, 8); surface.add(surfLight); surface.add(surfLight.target);
const surfAmb = new THREE.HemisphereLight(0xffffff, 0x444466, 0.6); surface.add(surfAmb);
const SKY = { Mercury: 0x05030F, Moon: 0x05030F, Venus: 0xE89A3C, Earth: 0x58C7F0, Mars: 0xE8A36A, Jupiter: 0xC77A3E, Saturn: 0xE8C77A, Uranus: 0x6FD6E0, Neptune: 0x2F4FD6 };
const GROUND = { Mercury: 0x9C95AE, Moon: 0xC9C5D6, Venus: 0xC77A3A, Earth: 0x4FCB5A, Mars: 0xD9542A, Jupiter: 0xF0C08A, Saturn: 0xFFF0C8, Uranus: 0xD8FBFF, Neptune: 0x9FB4FF };

// ---------------------------------------------------------------------------
// Views and camera
// ---------------------------------------------------------------------------
let mode = 'space', focus = null, compareWorlds = [], camAnim = null, yaw = 0.5, timeOn = true, jump = null, jumpsSeen = {};
const camTarget = new THREE.Vector3();
function spaceCam() { const k = Math.max(1, 1.5 / camera.aspect), d = 54 * k; return { pos: new THREE.Vector3(Math.sin(yaw) * d, 32 * k, Math.cos(yaw) * d), look: new THREE.Vector3(0, -2, 0) }; }
function worldPos(w) { return BODY[w].mesh.getWorldPosition(new THREE.Vector3()); }
function planetCam(w) { const p = worldPos(w), r = BODY[w].r * (w === 'Saturn' ? 1.8 : 1), dir = p.clone().setY(0).normalize(); if (!dir.lengthSq()) dir.set(0, 0, 1); const side = new THREE.Vector3(-dir.z, 0, dir.x); return { pos: p.clone().addScaledVector(dir, -r * 2.6).addScaledVector(side, r * 3.6).add(new THREE.Vector3(0, r * 1.5, 0)), look: p.clone().addScaledVector(side, -r * 0.6) }; }
function flyCam(to, ms = 1300) { camAnim = { from: camera.position.clone(), fromLook: camTarget.clone(), to, t0: performance.now(), ms }; SND.whoosh(); }
function setMode(m) {
  mode = m; space.visible = m === 'space' || m === 'planet'; compare.visible = m === 'compare'; surface.visible = m === 'surface';
  for (const w of WORLDS) labels[w].visible = m === 'space';
  scene.background = m === 'surface' ? new THREE.Color(SKY[focus]) : SPACE_BG.clone();
  $('info').classList.toggle('on', m === 'planet' || m === 'surface'); $('jumps').style.display = (m === 'surface' || (task && task.topic === 'jump')) ? 'flex' : 'none';
  $('hint').textContent = m === 'space' ? 'Tap a planet to fly there. Drag to turn.' : '';
  $('peak').style.display = 'none';
  renderBottom();
}
function goSpace() { focus = null; timeOn = true; setMode('space'); flyCam(spaceCam()); }
function visit(w) {
  focus = w; timeOn = false; setMode('planet'); flyCam(planetCam(w)); showInfo(w); SND.tap();
}
function showInfo(w) {
  const d = DATA[w];
  $('info').innerHTML = '<h2><span style="color:' + d.col + ';text-shadow:0 2px 0 #2B2140">●</span> ' + isWorld(w) + '</h2>' +
    '<div>🦘 Jump: ' + ftText(jumpFt(w)) + '</div><div>☀️ Day: ' + dayText(w) + '</div><div>🔄 Year: ' + yearText(w) + '</div>' +
    '<div>📏 Wide: ' + d.d.toLocaleString('en-US') + ' km</div><div>↗️ Tipped: ' + Math.round(seasonTilt(w)) + '°' + (d.spin < 0 ? ', spins backwards' : '') + '</div>' +
    (d.solid ? '' : '<div>☁️ No solid ground!</div>');
}
function showCompare(ws) {
  compareWorlds = ws; while (compare.children.length) compare.remove(compare.children[0]);
  const maxD = Math.max(...ws.map(w => DATA[w].d)), n = ws.length;
  ws.forEach((w, i) => {
    const r = 2.4 * DATA[w].d / maxD, b = makeWorld(w, Math.max(r, 0.02)); b.holder.position.set((i - (n - 1) / 2) * 6.2, 0, 0); compare.add(b.holder); b.w = w;
    const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex(isWorld(w)), depthTest: false })); lab.scale.set(3.2, 0.8, 1); lab.position.set(b.holder.position.x, -2.9, 0); compare.add(lab);
    if (r < 0.15) { const ring = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.45, 32), new THREE.MeshBasicMaterial({ color: 0xFFC93C })); ring.position.copy(b.holder.position); compare.add(ring); }
    compare.userData['b' + i] = b;
  });
  const cl = new THREE.PointLight(0xffffff, 1.4, 0, 0); cl.position.set(0, 4, 12); compare.add(cl);
  compare.position.set(0, 0, 0); setMode('compare');
  const cp = new THREE.Vector3(0, 60, 0); compare.position.copy(cp);
  flyCam({ pos: cp.clone().add(new THREE.Vector3(0, 0.5, 11 * Math.max(1, 1.4 / camera.aspect))), look: cp.clone().add(new THREE.Vector3(0, -0.6, 0)) }, 900);
}
function land(w) {
  focus = w; setMode('surface'); groundM.color.setHex(GROUND[w]); rocks.forEach(r => { r.material.color.setHex(GROUND[w]).offsetHSL(0, 0, -0.12); r.visible = DATA[w].solid; });
  ground.visible = !!DATA[w].solid; platform.visible = !DATA[w].solid; astro.position.set(0.4, 0, 0); showInfo(w);
  const base = surface.position; camAnim = null;
  camera.position.copy(base).add(new THREE.Vector3(0.6, 2.4, 8.6)); camTarget.copy(base).add(new THREE.Vector3(0, 2.0, 0)); camera.lookAt(camTarget);
  say(DATA[w].solid ? 'You landed on ' + isWorld(w) + '. Tap jump!' : w + ' has no solid ground. You are on a floating platform in the clouds. Tap jump!');
}
function doJump() {
  if (mode !== 'surface' || jump) return; ac();
  const j = jumpPlan(focus); jump = Object.assign({ t0: performance.now(), w: focus }, j); SND.boing(j.T / 1000);
}
// Same push on every world: height is 1 foot times 9.8 / g, time in the air is 2 * sqrt(2h / g), shown twice as slow.
function jumpPlan(w) { const ft = jumpFt(w), hM = 0.3048 * ft; return { ft, h: ft * FT, T: 2 * Math.sqrt(2 * hM / DATA[w].g) * 2 * 1000 }; }
function screenOf(v3) { const r = canvas.getBoundingClientRect(), v = v3.clone().project(camera); return { x: (v.x + 1) / 2 * r.width + r.left, y: (1 - v.y) / 2 * r.height + r.top, z: v.z }; }
function planetScreen(w) { return screenOf(worldPos(w)); }

// Tap a planet in space, or drag to turn the view.
let ptr = null;
canvas.addEventListener('pointerdown', ev => { ac(); ptr = { x: ev.clientX, y: ev.clientY, yaw, moved: false }; });
window.addEventListener('pointermove', ev => { if (!ptr || mode !== 'space') return; const dx = ev.clientX - ptr.x; if (Math.abs(dx) > 10) ptr.moved = true; if (ptr.moved) { yaw = ptr.yaw - dx * 0.006; camAnim = null; const c = spaceCam(); camera.position.copy(c.pos); camTarget.copy(c.look); camera.lookAt(camTarget); } });
window.addEventListener('pointerup', ev => {
  if (!ptr) return; const p = ptr; ptr = null; if (p.moved || mode !== 'space') return;
  let best = null, bd = 1e9;
  for (const w of WORLDS) { const s = planetScreen(w), d = Math.hypot(s.x - ev.clientX, s.y - ev.clientY), rad = 48 + (w === 'Moon' ? -18 : 0); if (s.z < 1 && d < rad && d < bd) { bd = d; best = w; } }
  if (best) tapPlanet(best);
});

// ---------------------------------------------------------------------------
// Rounds
// ---------------------------------------------------------------------------
let task = null, missed = false, won = false, nextTimer = null;
function newRound(speak = true) {
  clearTimeout(nextTimer); nextTimer = null; hideCard(); missed = false; won = false; jump = null; jumpsSeen = {};
  task = genLevel(P.lv); $('ask').textContent = task.text; $('jumps').innerHTML = '';
  $('badge').textContent = 'Level ' + (P.lv + 1) + ': ' + LEVELS[P.lv].name; $('stars').textContent = '⭐ ' + P.stars;
  fit(); goSpace(); if (speak) say(task.text);
}
function dot(w) { return DATA[w] ? '<i style="background:' + DATA[w].col + '"></i>' : ''; }
function renderBottom() {
  const b = $('bottom'); b.innerHTML = ''; if (!task) return;
  const add = (cls, html, fn, extra) => { const e = document.createElement('button'); e.className = cls; e.innerHTML = html; e.onclick = fn; if (extra) Object.assign(e.dataset, extra); b.appendChild(e); return e; };
  if (mode !== 'space') add('tool', '🌌 Back to space', goSpace);
  if (mode === 'planet') add('tool', '🚀 Land and jump', () => land(focus));
  if (mode === 'surface') add('tool big', '🦘 Jump!', doJump);
  if (task.kind === 'choice') {
    if (mode === 'space' && task.worlds.length === 2 && ['size', 'day', 'seasons', 'year'].includes(task.topic)) add('tool', '👀 Look closer', () => showCompare(task.worlds));
    if (mode === 'space' && task.topic === 'jump') task.worlds.forEach(w => add('tool', '🚀 Land on ' + isWorld(w), () => { focus = w; land(w); }));
    task.choices.forEach(c => { const e = add('ans', dot(c) + (DATA[c] ? isWorld(c) : c), () => answer(c), { a: c }); if (task.tried && task.tried.includes(c)) e.classList.add('no'); });
  }
}
function tapPlanet(w) {
  if (!task) return; visit(w);
  if (task.kind === 'fly' && !won) {
    if (w === task.ans) win();
    else { SND.miss(); if (!missed) { missed = true; record(false); } const t = 'That is ' + isWorld(w) + '. Look again for ' + (/Fly to (\w+)!/.test(task.text) ? task.ans : 'the right one') + '!'; showCard('Not that one!', t, true); say(t); }
  }
}
function answer(c) {
  if (!task || task.kind !== 'choice' || won) return;
  if (c === task.ans) { win(); return; }
  task.tried = (task.tried || []).concat(c); SND.miss();
  if (!missed) { missed = true; record(false); }
  const t = 'Not quite. Explore and try again!'; showCard('Hmm!', t, true); say(t); renderBottom();
}
function win() {
  won = true; const right = !missed; let ch = 0; if (right) ch = record(true);
  P.stars++; persist(); $('stars').textContent = '⭐ ' + P.stars; SND.win(); confetti();
  document.querySelectorAll('.ans').forEach(e => { if (e.dataset.a === task.ans) e.classList.add('yes'); });
  const msg = pick(['Out of this world!', 'Stellar!', 'You got it!', 'Super explorer!']);
  showCard(msg + ' ⭐', task.why + (ch > 0 ? ' Level up!' : ''), false, true); say(msg + ' ' + task.why);
  nextTimer = setTimeout(() => newRound(), 7000);
}
function showCard(t, sub, bad, next) {
  const c = $('card'); c.className = 'on' + (bad ? ' bad' : next ? ' win' : '');
  c.innerHTML = '<div class="c">' + t + (sub ? '<small>' + sub + '</small>' : '') + (next ? '<button class="pill" id="nextBtn">Next ▶</button>' : '') + '</div>';
  if (next) $('nextBtn').onclick = () => newRound(); else setTimeout(() => { if (c.classList.contains('bad')) hideCard(); }, 2400);
}
function hideCard() { $('card').className = ''; $('card').innerHTML = ''; }
function confetti() {
  const m = $('main'), cols = ['#FF4F8B', '#FFC93C', '#58C7F0', '#5CD38B', '#9B6BFF'];
  for (let k = 0; k < 40; k++) {
    const d = document.createElement('div'); d.className = 'conf'; d.style.background = pick(cols); d.style.left = (Math.random() * 100) + '%'; d.style.top = '-30px'; m.appendChild(d);
    const dx = (Math.random() - 0.5) * 200, rot = Math.random() * 720;
    d.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(' + dx + 'px,' + (m.clientHeight + 60) + 'px) rotate(' + rot + 'deg)' }], { duration: 1800 + Math.random() * 1200, easing: 'cubic-bezier(.3,.6,.6,1)' }).onfinish = () => d.remove();
  }
}

// ---------------------------------------------------------------------------
// Layout and loop
// ---------------------------------------------------------------------------
function fit() {
  const r = $('main').getBoundingClientRect(), w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { fit(); if (mode === 'space') { const c = spaceCam(); camera.position.copy(c.pos); camTarget.copy(c.look); camera.lookAt(camTarget); } });
const ORBIT_SEC = 20;   // Mercury goes around in 20 seconds; the rest keep their true ratio.
const SPIN_SEC = 8;     // Earth spins once in 8 seconds; the rest keep their true ratio.
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (timeOn) for (const w of PLANETS) { BODY[w].angle += dt * 2 * Math.PI / (ORBIT_SEC * DATA[w].year / DATA.Mercury.year); }
  for (const w of PLANETS) { const b = BODY[w], R = orbitR(w); b.holder.position.set(Math.cos(b.angle) * R, 0, -Math.sin(b.angle) * R); }
  BODY.Moon.angle += timeOn ? dt * 2 * Math.PI / (ORBIT_SEC * 27.3 / DATA.Mercury.year) : 0; BODY.Moon.holder.position.set(Math.cos(BODY.Moon.angle) * 1.8, 0, -Math.sin(BODY.Moon.angle) * 1.8);
  for (const w of WORLDS) BODY[w].mesh.rotation.y += dt * 2 * Math.PI / (SPIN_SEC * DATA[w].spin / DATA.Earth.spin);
  compareWorlds.forEach((w, i) => { const b = compare.userData['b' + i]; if (b) b.mesh.rotation.y += dt * 2 * Math.PI / (SPIN_SEC * DATA[w].spin / DATA.Earth.spin); });
  sunGlow.material.rotation = t * 0.05; sun.scale.setScalar(1 + Math.sin(t * 2) * 0.01);
  if (camAnim) {
    const u = Math.min(1, (now - camAnim.t0) / camAnim.ms), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    camera.position.lerpVectors(camAnim.from, camAnim.to.pos, e); camTarget.lerpVectors(camAnim.fromLook, camAnim.to.look, e);
    if (u >= 1) camAnim = null;
  } else if (mode === 'planet' && focus) { const c = planetCam(focus); camera.position.copy(c.pos); camTarget.copy(c.look); }
  camera.lookAt(camTarget);
  if (jump) {
    const u = (now - jump.t0) / jump.T;
    if (u >= 1) {
      astro.position.y = 0; SND.thud(); for (let k = 0; k < 14; k++) { const m = new THREE.Mesh(dustG, new THREE.MeshBasicMaterial({ color: GROUND[jump.w] })); m.position.set(astro.position.x, 0.1, 0); m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 1.5, (Math.random() - 0.5) * 2); surface.add(m); dust.push({ m, life: 1 }); }
      jumpsSeen[jump.w] = jump.ft; $('jumps').innerHTML = Object.keys(jumpsSeen).map(w => '<div>🦘 ' + isWorld(w) + ': ' + ftText(jumpsSeen[w]) + '</div>').join('');
      $('jumps').style.display = 'flex'; setTimeout(() => { if (!jump) $('peak').style.display = 'none'; }, 1500); jump = null;
    } else {
      astro.position.y = 4 * jump.h * u * (1 - u); astro.userData['arm1'].rotation.z = 0.35 + Math.sin(u * Math.PI) * 1.8; astro.userData['arm-1'].rotation.z = -0.35 - Math.sin(u * Math.PI) * 1.8;
      if (u > 0.5 && $('peak').style.display !== 'block') { const s = screenOf(astro.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 2.6, 0))), r = $('main').getBoundingClientRect(); $('peak').style.left = (s.x - r.left + 120) + 'px'; $('peak').style.top = (s.y - r.top) + 'px'; $('peak').textContent = ftText(jump.ft) + '!'; $('peak').style.display = 'block'; say(ftText(jump.ft)); }
    }
  }
  for (let k = dust.length - 1; k >= 0; k--) { const d = dust[k]; d.life -= dt * 1.5; d.m.userData.v.y -= (focus && DATA[focus] ? DATA[focus].g : 9.8) * 0.2 * dt; d.m.position.addScaledVector(d.m.userData.v, dt); d.m.scale.setScalar(Math.max(0.01, d.life)); if (d.life <= 0 || d.m.position.y < 0) { surface.remove(d.m); dust.splice(k, 1); } }
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
$('hear').onclick = () => say(task.text);
$('skip').onclick = () => newRound();

window.PLANET_EXPLORER = {
  stay() { clearTimeout(nextTimer); nextTimer = null; },
  DATA, PLANETS, WORLDS, LEVELS, START, jumpFt, weightOn, seasonTilt, catOf, recheck, CLUES, record, gen: genLevel, newRound,
  tapPlanet, answer, land, doJump, jumpPlan, visit, goSpace, showCompare, planetScreen,
  setLevel(i) { P.lv = i; P.st = { streak: 0, miss: 0 }; persist(); newRound(false); },
  get state() { return { level: P.lv, streak: P.st.streak, miss: P.st.miss, stars: P.stars, task, missed, won, mode, focus, jumping: !!jump, jumpsSeen: Object.assign({}, jumpsSeen), astroY: astro.position.y }; },
};
fit(); { const c = spaceCam(); camera.position.copy(c.pos); camTarget.copy(c.look); camera.lookAt(camTarget); }
newRound(false); requestAnimationFrame(frame);
setTimeout(() => say(task.text), 600);
</script>
</body>
