<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>

<title>Ecosystem Aquarium</title>
<!--
  Ecosystem Aquarium. A living 3D fish tank. Set the fish, snails, plants, light and food, then run the days and
  see if the tank thrives or crashes. One file, offline, no network.
  The simulation is simple, step by step and has no randomness, so the same tank always gives the same days:
    Air (oxygen) each day = 20 from the surface + 5 for every plant times the light level,
      minus 4 for every small fish, 1 for every snail, 10 for every big fish, minus 10 when the water is green.
      Fish and big fish need 10 or more. Snails need 5 or more.
    Food: each pinch feeds 2 small fish. Extra food rots and feeds the algae.
    Algae grows 8 for every light level and 6 for every extra pinch, and shrinks 10 for every snail and 3 for every
      plant. Fish get sick at 60 (green water). Plants get covered at 80.
    Snails eat algae: they need 6 algae each a day. Plants need the light on.
    Room: the tank holds 3 fish, plus 2 more for every plant (places to hide).
    Food chain levels: each big fish eats 1 small fish a day. Happy small fish have babies (half as many again),
      up to the room in the tank.
  The ladder of levels goes from turning on the light, to air and food, to algae and snails, room to swim,
  baby fish and food chains.
  Four right first try in a row moves up a level; two missed tanks in a row moves down.
  Progress is kept in localStorage (key ecosystem-aquarium-v1). New players start at a 2nd grade level.
  Test hook: window.ECOSYSTEM_AQUARIUM.
  three.js r149 is inlined below under its MIT License (Copyright 2010-2023 three.js authors).
-->
<style>

<div id="app">
  <header>
    <h1>🐠 Ecosystem Aquarium</h1>
    <span id="badge"></span>
    <span id="stars">⭐ 0</span>
    <button class="pill" id="skip" title="New tank">🔀 New</button>
  </header>
  <main id="main">
    <canvas id="gl"></canvas>
    <div id="askRow"><div id="ask"></div><button id="hear" title="Hear it again">🔈</button></div>
    <div id="gauges">
      <div id="locked" style="display:flex;flex-direction:column;gap:8px"></div>

      <div class="g">💧 Clear <div class="bar"><i id="gA" style="background:#5CD38B"></i></div></div>

<script>/*@@THREE@@*/</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ---------------------------------------------------------------------------
// Simulation. No randomness: the same tank always gives the same days.
// setup = { F: small fish, S: snails, P: plants, L: light 0-3, f: pinches of food a day }
// lv = { B: big fish, breed, D: days, goal: { groups, grow, minEnd } }
// ---------------------------------------------------------------------------
const LIGHTS = ['Off', 'Dim', 'Sunny', 'Very bright'];
const RANGE = { F: [0, 12], S: [0, 6], P: [0, 6], L: [0, 3], f: [0, 5] };
const VARS = ['F', 'S', 'P', 'L', 'f'];
const NUM = { O_SURFACE: 20, O_PLANT: 5, O_FISH: 4, O_SNAIL: 1, O_BIG: 10, O_GREEN: 10, FISH_AIR: 10, SNAIL_AIR: 5,
  A_LIGHT: 8, A_FOOD: 6, A_SNAIL: 10, A_PLANT: 3, GREEN: 60, COVER: 80, SNAIL_EAT: 6, ROOM: 3, ROOM_PLANT: 2 };
const roomOf = P => NUM.ROOM + NUM.ROOM_PLANT * P;
function simulate(setup, lv) {
  let F = setup.F, A = 0; const S = setup.S, P = setup.P, L = setup.L, f = setup.f, B = lv.B || 0, out = [];
  for (let d = 1; d <= lv.D; d++) {
    const room = roomOf(P);
    const O = clamp(NUM.O_SURFACE + NUM.O_PLANT * P * L - NUM.O_FISH * F - NUM.O_SNAIL * S - NUM.O_BIG * B - (A >= NUM.GREEN ? NUM.O_GREEN : 0), 0, 100);
    const fed = 2 * f >= F, left = Math.max(0, 2 * f - F), snailFood = A + NUM.A_LIGHT * L + NUM.A_FOOD * left;
    const A2 = clamp(A + NUM.A_LIGHT * L + NUM.A_FOOD * left - NUM.A_SNAIL * S - NUM.A_PLANT * P, 0, 100);
    const why = { fish: null, snail: null, plant: null, big: null };
    if (F > 0) why.fish = O < NUM.FISH_AIR ? 'air' : !fed ? 'food' : A2 >= NUM.GREEN ? 'algae' : F > room ? 'crowd' : null;
    if (S > 0) why.snail = O < NUM.SNAIL_AIR ? 'air' : snailFood < NUM.SNAIL_EAT * S ? 'hungry' : null;
    if (P > 0) why.plant = L < 1 ? 'dark' : A2 >= NUM.COVER ? 'algae' : null;
    if (B > 0) why.big = O < NUM.FISH_AIR ? 'air' : F < B ? 'hungry' : null;
    const F0 = F; let eaten = 0, born = 0;
    if (B > 0) { eaten = Math.min(F, B); F -= eaten; }
    if (lv.breed && !why.fish && F >= 2) { const n = Math.max(F, Math.min(room, F + Math.floor(F / 2))); born = n - F; F = n; }
    A = A2;
    out.push({ day: d, O, A, F: F0, Fend: F, eaten, born, fed, left, room, why });
  }
  return out;
}
// Did the tank meet its goal? Returns the first problem, or ok.
function judge(setup, lv) {
  const days = simulate(setup, lv), g = lv.goal;
  for (const d of days) for (const who of g.groups) if (d.why[who]) return { ok: false, day: d.day, who, why: d.why[who], days };
  const end = days[days.length - 1].Fend;
  if (g.grow && end < g.grow) return { ok: false, day: lv.D, who: 'fish', why: 'grow', days };
  if (g.minEnd && end < g.minEnd) return { ok: false, day: lv.D, who: 'fish', why: 'chainEnd', days };
  return { ok: true, days };
}
// Every setup the child could choose on this level.
function setups(lv) {
  let list = [Object.assign({}, lv.lock)];
  for (const v of VARS) {
    if (v in lv.lock) continue; const [a, b] = lv.range[v], next = [];
    for (const s of list) for (let x = a; x <= b; x++) next.push(Object.assign({}, s, { [v]: x }));
    list = next;
  }
  return list;
}
function solutions(lv) { return setups(lv).filter(s => judge(s, lv).ok); }

// ---------------------------------------------------------------------------
// Levels
// ---------------------------------------------------------------------------
const half = F => Math.ceil(F / 2);
const fill = (o, lock, adj) => { o.lock = lock; o.range = {}; o.start = Object.assign({}, lock); for (const v in adj) { o.range[v] = adj[v][0]; o.start[v] = adj[v][1]; } for (const v of VARS) if (!(v in o.start)) { o.lock[v] = 0; o.start[v] = 0; } return o; };
const LEVELS = [
  { name: 'Plants need light', gen() { return fill({ D: 2, goal: { groups: ['plant'] }, text: 'The plants look sad. Turn on the light so they stay green for 2 days!' }, { F: 2, S: 0, P: 2, f: 1 }, { L: [[0, 3], 0] }); } },

  fishes.forEach((o, k) => swim(o, view.sick.fish, k)); bigs.forEach((o, k) => swim(o, view.sick.big, k));
  snails.forEach(o => { const u = o.userData; const sp = u.speed * (view.sick.snail ? 0.2 : 1); o.position.x += u.dir * sp * dt; if (Math.abs(o.position.x) > TW / 2 - 0.6) { u.dir *= -1; o.position.x = Math.sign(o.position.x) * (TW / 2 - 0.6); } o.rotation.y = u.dir > 0 ? 0 : Math.PI; o.scale.setScalar(1 + Math.sin((u.pop || 0) * Math.PI) * 0.6); if (u.pop > 0) u.pop = Math.max(0, u.pop - dt * 2); });
  plants.forEach(o => { const u = o.userData; u.m.color.copy(u.base).lerp(SAD_PLANT, view.sick.plant ? 0.75 : 0); u.stems.forEach((ch, s) => ch.forEach((seg, k) => { seg.rotation.z = (k ? 1 : 0) * Math.sin(t * 1.3 + u.ph + s + k * 0.6) * (view.sick.plant ? 0.25 : 0.12); seg.rotation.x = Math.sin(t * 0.9 + u.ph + k) * 0.05; })); const sc = 1 + Math.sin((u.pop || 0) * Math.PI) * 0.5; o.scale.set(sc, view.sick.plant ? sc * 0.8 : sc, sc); if (u.pop > 0) u.pop = Math.max(0, u.pop - dt * 2); });
  // Plants make oxygen bubbles when the light is on.
  const rate = plants.length * lit * (view.sick.plant ? 0.2 : 1) * 3;
  for (let k = 0; k < BUB; k++) {
    const b = bubData[k];
    if (!b.on && plants.length && Math.random() < rate * dt / 6) { const p = pick(plants); b.on = true; b.p.set(p.position.x + (Math.random() - 0.5) * 0.4, SAND_Y + 0.5 + Math.random() * 1.5, p.position.z + (Math.random() - 0.5) * 0.3); b.s = 0.6 + Math.random() * 0.8; }
    if (b.on) { b.p.y += dt * (0.7 + b.s * 0.3); b.p.x += Math.sin(t * 4 + k) * dt * 0.1; if (b.p.y > WATER_TOP) b.on = false; }
    SC.setScalar(b.on ? b.s : 0.0001); M4.compose(b.p, Q, SC); bubbles.setMatrixAt(k, M4);
  }
  bubbles.instanceMatrix.needsUpdate = true;
  const nA = Math.round(ALG * Math.min(1, a * 1.2));
  for (let k = 0; k < ALG; k++) { const [x, y, s] = algPos[k]; V.set(x, y, -TD / 2 + 0.1); SC.setScalar(k < nA ? s : 0.0001); M4.compose(V, Q, SC); algae.setMatrixAt(k, M4); }
  algae.instanceMatrix.needsUpdate = true;
  for (let k = flakes.length - 1; k >= 0; k--) { const f = flakes[k]; f.position.y -= f.userData.v * dt; f.rotation.y += dt * 3; f.position.x += Math.sin(t * 3 + k) * dt * 0.1; if (f.position.y < SAND_Y + 0.1) { tank.remove(f); flakes.splice(k, 1); } }
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const CTL = { F: ['🐟', 'Fish'], S: ['🐌', 'Snails'], P: ['🌿', 'Plants'], L: ['💡', 'Light'], f: ['🍤', 'Food a day'] };
let task = null, setup = null, missed = false, won = false, running = false, speed = 1, runTimer = null;
function renderControls() {
  // Settings the child can change sit in the bottom bar. Settings fixed by the level show as chips by the gauges.
  const box = $('controls'), lk = $('locked'); box.innerHTML = ''; lk.innerHTML = '';
  for (const v of VARS) {
    const val = v === 'L' ? LIGHTS[setup.L] : setup[v];
    if (v in task.lock) {
      if (!task.lock[v] && v !== 'L') continue;
      const c = document.createElement('div'); c.className = 'g lockchip'; c.dataset.v = v; c.textContent = '🔒 ' + CTL[v][0] + ' ' + CTL[v][1] + ': ' + val; lk.appendChild(c); continue;
    }
    const c = document.createElement('div'); c.className = 'ctl' + (v === 'L' ? ' light' : ''); c.dataset.v = v;
    c.innerHTML = '<div class="lab">' + CTL[v][0] + ' ' + CTL[v][1] + '</div><div class="row"><button data-d="-1" title="Less">−</button><span class="val">' + val + '</span><button data-d="1" title="More">+</button></div>';
    box.appendChild(c);
    c.querySelectorAll('button').forEach(b => {
      const [lo, hi] = task.range[v], d = +b.dataset.d; b.disabled = running || (d < 0 ? setup[v] <= lo : setup[v] >= hi);
      b.onclick = () => change(v, d);
    });
  }
  if (task.B) { const c = document.createElement('div'); c.className = 'g lockchip'; c.textContent = '🔒 🦈 Big fish: ' + task.B; lk.appendChild(c); }
  const r = document.createElement('button'); r.id = 'run'; r.textContent = '▶ Run ' + task.D + ' days'; r.disabled = running; r.onclick = run; box.appendChild(r);
  $('room').textContent = '🏠 Room for ' + roomOf(setup.P) + ' fish';
}
function change(v, d) {
  if (running || won) return; const [lo, hi] = task.range[v]; const x = clamp(setup[v] + d, lo, hi); if (x === setup[v]) return;
  setup[v] = x; ac();
  if (v === 'f') { if (d > 0) dropFood(1); SND.plop(); }
  else if (v === 'L') { SND.tick(); view.light = setup.L / 3; }
  else { d > 0 ? SND.bloop() : SND.plop(); syncCreatures(setup); }
  resetView(); renderControls();
}
function resetView() { view.light = setup.L / 3; view.algae = 0; view.night = 0; view.sick = { fish: false, snail: false, plant: false, big: false }; gauges(null); }
function gauges(d) {
  const O = d ? d.O : null; $('gO').style.width = (O === null ? 0 : Math.min(100, O * 2)) + '%'; $('gA').style.width = (100 - (d ? d.A : 0)) + '%';
}

// ---------------------------------------------------------------------------
// Rounds
// ---------------------------------------------------------------------------
const WHO = { fish: 'fish', snail: 'snails', plant: 'plants', big: 'big fish' };
function explain(r) {
  const k = r.who + ':' + r.why;
  const T = {
    'fish:air': 'The fish ran out of air. Plants make air when the light is on.',
    'big:air': 'The big fish ran out of air. Big fish need lots of air, so add plants and light.',
    'snail:air': 'The snails ran out of air. Plants make air when the light is on.',
    'fish:food': 'The fish were hungry. Each pinch of food feeds 2 fish.',
    'fish:algae': 'The water turned green with algae. Snails and plants keep it clear. Too much light or food makes algae grow.',
    'plant:algae': 'Algae covered the plants. Snails and plants keep it clear. Too much light or food makes algae grow.',
    'fish:crowd': 'Too crowded! The tank holds 3 fish, plus 2 more for every plant.',
    'snail:hungry': 'The snails were hungry. Snails eat algae, and algae needs a little light. Fewer snails need less.',
    'plant:dark': 'The plants need light to grow.',
    'big:hungry': 'The big fish had no small fish to eat. Start with more small fish.',
    'fish:grow': 'Not enough baby fish yet. Happy fish have babies when there is room and food for everyone.',
    'fish:chainEnd': 'The small fish ran out. Start with more small fish, and give the babies room and food.',
  };
  return T[k] || 'Something went wrong in the tank.';
}
function newRound(speak = true) {
  clearTimeout(runTimer); runTimer = null; hideCard();
  missed = false; won = false; running = false;
  task = genLevel(P.lv); setup = Object.assign({}, task.start);
  syncCreatures({ F: 0, S: 0, P: 0 }); syncCreatures(setup); resetView();
  $('ask').textContent = task.text; $('badge').textContent = 'Level ' + (P.lv + 1) + ': ' + LEVELS[P.lv].name; $('stars').textContent = '⭐ ' + P.stars;
  $('dayBox').classList.remove('on'); $('log').innerHTML = '';
  renderControls(); fit();
  if (speak) say(task.text);
}
function logLine(t) { const d = document.createElement('div'); d.textContent = t; $('log').appendChild(d); while ($('log').children.length > 5) $('log').firstChild.remove(); }
function run() {
  if (running || won) return; ac(); running = true; renderControls(); $('log').innerHTML = '';
  const res = judge(setup, task), stop = res.ok ? task.D : res.day; let d = 0;
  const step = () => {
    if (d >= stop) { finish(res); return; }
    const day = res.days[d]; d++;
    $('dayBox').textContent = '☀️ Day ' + d + ' of ' + task.D; $('dayBox').classList.add('on'); SND.day(); dropFood(setup.f);
    view.night = 0; view.algae = day.A; gauges(day);
    if (task.breed || task.B) syncCreatures({ F: day.Fend, S: setup.S, P: setup.P });
    const bad = task.goal.groups.filter(g => day.why[g]);
    bad.forEach(g => { view.sick[g] = true; }); if (bad.length) SND.sad();
    let line = 'Day ' + d + ': ' + (bad.length ? '😟 ' + bad.map(g => WHO[g]).join(', ') + ' not well' : '😊 all well');
    if (day.eaten) line += ', 🦈 ate ' + day.eaten; if (day.born) line += ', 🐣 ' + day.born + ' born';
    logLine(line);
    const T = 2200 * speed;
    setTimeout(() => { view.night = 1; }, T * 0.7);
    runTimer = setTimeout(step, T);
  };
  step();
}
function finish(res) {
  running = false; view.night = 0;
  if (res.ok) {
    won = true; const right = !missed; let ch = 0; if (right) ch = record(true);
    P.stars++; persist(); $('stars').textContent = '⭐ ' + P.stars; SND.win(); confetti();
    const msg = pick(['Your tank is thriving!', 'Happy tank!', 'Great balance!']);
    showCard(msg + ' ⭐', 'Everyone stayed healthy for ' + task.D + ' days.' + (ch > 0 ? ' Level up!' : ''), false, true); say(msg);
    runTimer = setTimeout(() => newRound(), 5200);
  } else {
    if (!missed) { missed = true; const ch = record(false); }
    SND.miss(); const why = explain(res);
    showCard('Uh oh! Day ' + res.day, why, true, false, true); say('Uh oh. ' + why);
    renderControls();
  }
}
function retry() { hideCard(); resetView(); syncCreatures(setup); $('dayBox').classList.remove('on'); renderControls(); }
function showCard(t, sub, bad, next, again) {
  const c = $('card'); c.className = 'on' + (bad ? ' bad' : next ? ' win' : '');
  c.innerHTML = '<div class="c">' + t + (sub ? '<small>' + sub + '</small>' : '') + (next ? '<button class="pill" id="nextBtn">Next ▶</button>' : '') + (again ? '<button class="pill" id="againBtn">🔧 Fix the tank</button>' : '') + '</div>';
  if (next) $('nextBtn').onclick = () => newRound(); if (again) $('againBtn').onclick = retry;
}
function hideCard() { $('card').className = ''; $('card').innerHTML = ''; }
function confetti() {
  const m = $('main'), cols = ['#FF4F8B', '#FFC93C', '#58C7F0', '#5CD38B', '#9B6BFF'];
  for (let k = 0; k < 40; k++) {
    const d = document.createElement('div'); d.className = 'conf'; d.style.background = pick(cols); d.style.left = (Math.random() * 100) + '%'; d.style.top = '-30px'; m.appendChild(d);
    const dx = (Math.random() - 0.5) * 200, rot = Math.random() * 720;
    d.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(' + dx + 'px,' + (m.clientHeight + 60) + 'px) rotate(' + rot + 'deg)' }], { duration: 1800 + Math.random() * 1200, easing: 'cubic-bezier(.3,.6,.6,1)' }).onfinish = () => d.remove();
  }
}

// ---------------------------------------------------------------------------
// Layout and loop
// ---------------------------------------------------------------------------
function fit() {
  const r = $('main').getBoundingClientRect(), w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const k = Math.max(1, 1.75 / camera.aspect);
  camera.position.set(0, 1.4 * k, 11.8 * k); camera.lookAt(0, 0.1, 0); camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; tickTank(dt, now / 1000); renderer.render(scene, camera); requestAnimationFrame(frame); }
$('hear').onclick = () => say(task.text);
$('skip').onclick = () => newRound();
window.addEventListener('pointerdown', () => ac(), { once: true });

window.ECOSYSTEM_AQUARIUM = {
  stay() { clearTimeout(runTimer); runTimer = null; },
  LEVELS, START, NUM, simulate, judge, solutions, setups, record, gen: genLevel, newRound, run, change, retry,
  setLevel(i) { P.lv = i; P.st = { streak: 0, miss: 0 }; persist(); newRound(false); },
  set fast(on) { speed = on ? 0.01 : 1; },
  get state() { return { level: P.lv, streak: P.st.streak, miss: P.st.miss, stars: P.stars, task, setup: Object.assign({}, setup), missed, won, running, fish: fishes.length, view }; },
};
fit(); newRound(false); requestAnimationFrame(frame);
setTimeout(() => say(task.text), 600);
</script>
</body>
